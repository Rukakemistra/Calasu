<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calasu Life Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        zinc: { 900: '#18181b', 950: '#09090b' } 
                    }
                },
            },
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Sửa lỗi UMD của lucide-react -->
    <script>window.react = window.React;</script>
    
    <!-- Recharts (Thư viện Biểu đồ) -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.0/Recharts.js"></script>

    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    
   <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide-react@0.284.0/dist/umd/lucide-react.min.js"></script>
    <script>if (window.lucide && !window.lucideReact) window.lucideReact = window.lucide;</script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">

    <style>
        body { 
            -webkit-tap-highlight-color: transparent; 
            background-color: #09090b; 
            overscroll-behavior-y: none; 
        }
        
        @keyframes slideUpSheet { 
            0% { transform: translateY(100%); opacity: 0; } 
            100% { transform: translateY(0); opacity: 1; } 
        }
        @keyframes fadeScale { 
            0% { opacity: 0; transform: scale(0.95); } 
            100% { opacity: 1; transform: scale(1); } 
        }
        @keyframes fadeInBlur { 
            0% { opacity: 0; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); } 
            100% { opacity: 1; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); } 
        }
        @keyframes toastPop {
            0% { transform: translateX(-50%) translateY(-100%) scale(0.9); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
        }
        
        .modal-overlay { animation: fadeInBlur 0.3s ease-out forwards; }
        .bottom-sheet { animation: slideUpSheet 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top-color: rgba(255,255,255,0.5); }
        .dark .glass { background: rgba(9, 9, 11, 0.75); border-top-color: rgba(39,39,42,0.5); }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .dark .glass-header { background: rgba(9, 9, 11, 0.85); }
        
        / === TỌA ĐỘ 1 (CODE MỚI): MỞ KHÓA QUÁN TÍNH CAO TRÊN CHROME === /
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
main, .overflow-y-auto, .overflow-x-auto, .snap-x {
-webkit-overflow-scrolling: touch;
overscroll-behavior: contain;
will-change: scroll-position;
transform: translateZ(0);
}
/ Gỡ bỏ phanh gấp của Chrome để vẩy tay có quán tính mượt như app */
.snap-always { scroll-snap-stop: normal !important; }
.snap-mandatory { scroll-snap-type: x proximity !important; }
#journal-week-scroll > button {
transform: translateZ(0);
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
}
        
        input[type="time"]::-webkit-calendar-picker-indicator { opacity: 0; width: 100%; height: 100%; position: absolute; top: 0; left: 0; cursor: pointer; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        .crossfade-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
        .xfade-1 { opacity: 1 !important; }
        .xfade-2 { animation: xf2 6s infinite; } @keyframes xf2 { 0%, 45% { opacity: 1; z-index: 2; } 50%, 95% { opacity: 0; z-index: 1; } 100% { opacity: 1; z-index: 2; } }
        .xfade-3 { animation: xf3 9s infinite; } @keyframes xf3 { 0%, 28% { opacity: 1; z-index: 2; } 33%, 95% { opacity: 0; z-index: 1; } 100% { opacity: 1; z-index: 2; } }
        .xfade-4 { animation: xf4 12s infinite; } @keyframes xf4 { 0%, 20% { opacity: 1; z-index: 2; } 25%, 95% { opacity: 0; z-index: 1; } 100% { opacity: 1; z-index: 2; } }
        .xfade-5 { animation: xf5 15s infinite; } @keyframes xf5 { 0%, 15% { opacity: 1; z-index: 2; } 20%, 95% { opacity: 0; z-index: 1; } 100% { opacity: 1; z-index: 2; } }

        @keyframes flashRed { 0%, 100% { background-color: #fee2e2; color: #ef4444; } 50% { background-color: #ef4444; color: white; } }
        .timer-done { animation: flashRed 1s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
       try {
            // Ép hệ thống bắt đúng biến LucideReact (chữ L viết hoa)
            let IconLib = window.LucideReact || window.lucideReact || window.lucide;
            if (IconLib && !IconLib.Alert) { IconLib = { ...IconLib, Alert: IconLib.AlertTriangle || IconLib.Info }; }
            
            if (!IconLib || !IconLib.Calendar) {
                const E = (char) => ({ size, className }) => <span className={className} style={{ fontSize: size ? size * 0.8 : 'inherit', lineHeight: 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>{char}</span>;
                IconLib = {
                    Calendar: E("📅"), Plus: E("➕"), Trash2: E("🗑️"), Camera: E("📷"), Sparkles: E("✨"),
                    Wheat: E("🌾"), Beef: E("🥩"), Pencil: E("✏️"), Sunrise: E("🌅"), Sunset: E("🌇"),
                    Coffee: E("☕"), Dumbbell: E("🏋️"), X: E("❌"), ChevronLeft: E("◀️"), ChevronRight: E("▶️"),
                    Utensils: E("🍽️"), Moon: E("🌙"), Flame: E("🔥"), Droplet: E("💧"), Sun: E("☀️"),
                    Clock: E("🕒"), CheckCircle: E("✅"), Loader: E("⏳"), Activity: E("📈"), Image: E("🖼️"),
                    Cloud: E("☁️"), Download: E("⬇️"), Upload: E("⬆️"), Skull: E("💀"), Bomb: E("💣"), Heart: E("💚"), Alert: E("❗"), XCircle: E("❌"),
                    Timer: E("⏱️"), Book: E("📓"), Home: E("🏠"), Plane: E("✈️"), Smile: E("😊"), Frown: E("🙁"), Brain: E("🧠"), FileText: E("📝"), Menu: E("☰"),
                    Check: E("✓"), Send: E("🚀"), Music: E("🎵"), Smartphone: E("📱"), Monitor: E("💻"), Search: E("🔍"), Copy: E("📋")
                };
            }

            const {
                Calendar: CalendarIcon, Plus: PlusIcon, Trash2: Trash2Icon, Camera: CameraIcon, Sparkles: SparklesIcon,
                Wheat: WheatIcon, Beef: BeefIcon, Pencil: PencilIcon, Sunrise: SunriseIcon, Sunset: SunsetIcon, Coffee: CoffeeIcon,
                Dumbbell: DumbbellIcon, X: XIcon, ChevronLeft: ChevronLeftIcon, ChevronRight: ChevronRightIcon,
                Utensils: UtensilsIcon, Moon: MoonIcon, Flame: FlameIcon, Droplet: DropletIcon, Sun: SunIcon,
                Clock: ClockIcon, CheckCircle: CheckCircleIcon, Loader: LoaderIcon, Activity: ActivityIcon, Image: ImageIcon,
                Cloud: CloudIcon, Download: DownloadIcon, Upload: UploadIcon, Skull: SkullIcon, Bomb: BombIcon, Heart: HeartIcon, Alert: AlertIcon, XCircle: XCircleIcon,
                Timer: TimerIcon, Book: BookIcon, Home: HomeIcon, Plane: PlaneIcon, Smile: SmileIcon, Frown: FrownIcon, Brain: BrainIcon, FileText: FileTextIcon, Menu: MenuIcon,
                Check: CheckIcon, Send: SendIcon, Music: MusicIcon, Smartphone: SmartphoneIcon, Monitor: MonitorIcon, Meh: MehIcon, Search: SearchIcon, Filter: FilterIcon, Copy: CopyIcon
            } = IconLib;

            const { useState, useEffect, useRef } = React;
            const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = window.Recharts || {};
            
            const VN_DAYS = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
            
            const formatDate = (date) => {
                const d = String(date.getDate()).padStart(2, '0');
                const m = String(date.getMonth() + 1).padStart(2, '0');
                return `${d}/${m}/${date.getFullYear()}`;
            };
            
            const getStartOfWeek = (date) => {
                const d = new Date(date);
                const day = d.getDay();
                return new Date(d.setDate(d.getDate() - day + (day === 0 ? -6 : 1)));
            };
            
            const getStartOfMonth = (date) => new Date(date.getFullYear(), date.getMonth(), 1);
            const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const parseDateToNumber = (dateStr) => {
                if(!dateStr) return 0;
                const p = dateStr.split('/');
                if(p.length !== 3) return 0;
                return parseInt(p[2])*10000 + parseInt(p[1])*100 + parseInt(p[0]);
            };

            const getMacroStatus = (kcal, pro) => {
                if (!kcal && !pro) return null;
                let pScore = pro >= 115 ? 3 : (pro >= 90 ? 2 : 1);
                let cScore = kcal <= 2100 ? 3 : (kcal <= 2500 ? 2 : 1);
                let total = pScore + cScore;
                if (total === 6) return { bg: 'bg-emerald-500', border: 'border-emerald-600', text: 'text-white' };
                if (total >= 4) return { bg: 'bg-yellow-400', border: 'border-yellow-500', text: 'text-slate-800 dark:text-slate-900' };
                if (total === 3) return { bg: 'bg-red-500', border: 'border-red-600', text: 'text-white' };
                return { bg: 'bg-slate-800 dark:bg-zinc-800', border: 'border-slate-900 dark:border-zinc-700', text: 'text-white' };
            };

            const getSleepStatus = (mins) => {
                if (!mins || mins === 0) return null;
                if (mins >= 450) return { bg: 'bg-emerald-500', border: 'border-emerald-600', text: 'text-white' };
                if (mins >= 360) return { bg: 'bg-yellow-400', border: 'border-yellow-500', text: 'text-slate-800 dark:text-slate-900' };
                return { bg: 'bg-red-500', border: 'border-red-600', text: 'text-white' };
            };

            const getWorkoutColor = (type) => {
                if(!type) return { fill: 'bg-slate-500 dark:bg-zinc-600', text: 'text-slate-600 dark:text-slate-400', border: 'border-slate-500 dark:border-zinc-600', textLight: 'text-white' };
                switch(type) {
                    case 'Upper': return { text: 'text-orange-600 dark:text-orange-400', fill: 'bg-orange-500', border: 'border-orange-500', textLight: 'text-white', lightBg: 'bg-orange-50 dark:bg-orange-500/10' };
                    case 'Lower': return { text: 'text-yellow-600 dark:text-yellow-400', fill: 'bg-yellow-400', border: 'border-yellow-500', textLight: 'text-slate-800 dark:text-slate-900', lightBg: 'bg-yellow-50 dark:bg-yellow-500/10' };
                    case 'Push': return { text: 'text-emerald-600 dark:text-emerald-400', fill: 'bg-emerald-500', border: 'border-emerald-500', textLight: 'text-white', lightBg: 'bg-emerald-50 dark:bg-emerald-500/10' };
                    case 'Pull': return { text: 'text-blue-600 dark:text-blue-400', fill: 'bg-blue-500', border: 'border-blue-500', textLight: 'text-white', lightBg: 'bg-blue-50 dark:bg-blue-500/10' };
                    case 'Leg': return { text: 'text-purple-600 dark:text-purple-400', fill: 'bg-purple-500', border: 'border-purple-500', textLight: 'text-white', lightBg: 'bg-purple-50 dark:bg-purple-500/10' };
                    default: return { text: 'text-slate-600 dark:text-slate-400', fill: 'bg-slate-500 dark:bg-zinc-600', border: 'border-slate-500 dark:border-zinc-600', textLight: 'text-white', lightBg: 'bg-slate-50 dark:bg-zinc-800/50' };
                }
            };

            const getCircadianWarning = (sleeps) => {
                if (!sleeps || sleeps.length === 0) return null;
                const mainSleep = sleeps[sleeps.length - 1];
                if (!mainSleep?.sleepTime || !mainSleep?.wakeTime) return null;
                const [sH, sM] = mainSleep.sleepTime.split(':').map(Number);
                const [wH, wM] = mainSleep.wakeTime.split(':').map(Number);
                let isLateSleep = false;
                if (sH >= 0 && sH <= 5) { if (sH === 0 && sM === 0) isLateSleep = false; else isLateSleep = true; }
                const isLateWake = (wH > 7) || (wH === 7 && wM > 0);
                if (isLateSleep && isLateWake) return 'bomb';
                if (isLateSleep) return 'late_sleep';
                if (isLateWake) return 'late_wake';
                return 'heart';
            };

            const renderCircadianIcon = (type, size = 14) => {
                const baseClass = "bg-white dark:bg-zinc-800 backdrop-blur-sm rounded-full p-0.5 shadow-sm inline-flex items-center justify-center border border-slate-200 dark:border-zinc-700 z-20";
                if (type === 'bomb') return <div className={baseClass}><BombIcon size={size} className="text-slate-800 dark:text-slate-200" /></div>;
                if (type === 'late_sleep') return <div className={baseClass}><AlertIcon size={size} className="text-red-500 dark:text-red-400" /></div>;
                if (type === 'late_wake') return <div className={baseClass}><XCircleIcon size={size} className="text-red-500 dark:text-red-400" /></div>;
                if (type === 'heart') return <div className={baseClass}><HeartIcon size={size} className="text-emerald-500 dark:text-emerald-400" /></div>;
                return null;
            };

         const MOODS = [
                { val: 0, label: 'Tồi tệ', twBg: 'bg-rose-50 dark:bg-rose-500/10', twText: 'text-rose-600 dark:text-rose-400', twBorder: 'border-rose-200 dark:border-rose-500/20', icon: SkullIcon },
                { val: 1, label: 'Mệt mỏi', twBg: 'bg-orange-50 dark:bg-orange-500/10', twText: 'text-orange-600 dark:text-orange-400', twBorder: 'border-orange-200 dark:border-orange-500/20', icon: CloudIcon },
                { val: 2, label: 'Chán ngắt', twBg: 'bg-yellow-50 dark:bg-yellow-500/10', twText: 'text-yellow-600 dark:text-yellow-400', twBorder: 'border-yellow-200 dark:border-yellow-500/20', icon: FrownIcon },
                { val: 3, label: 'Bình ổn', twBg: 'bg-sky-50 dark:bg-sky-500/10', twText: 'text-sky-600 dark:text-sky-400', twBorder: 'border-sky-200 dark:border-sky-500/20', icon: MehIcon },
                { val: 4, label: 'Vui vẻ', twBg: 'bg-emerald-50 dark:bg-emerald-500/10', twText: 'text-emerald-600 dark:text-emerald-400', twBorder: 'border-emerald-200 dark:border-emerald-500/20', icon: SmileIcon },
                { val: 5, label: 'Thăng hoa', twBg: 'bg-purple-50 dark:bg-purple-500/10', twText: 'text-purple-600 dark:text-purple-400', twBorder: 'border-purple-200 dark:border-purple-500/20', icon: SparklesIcon }
            ];

            const OUTINGS = [
                { val: 1, label: 'Ở nhà', Icon: HomeIcon, color: 'text-blue-500 dark:text-blue-400' },
                { val: 2, label: 'Học/Làm', Icon: BookIcon, color: 'text-yellow-600 dark:text-yellow-400' },
                { val: 3, label: 'Đi chơi', Icon: CoffeeIcon, color: 'text-emerald-600 dark:text-emerald-400' },
                { val: 4, label: 'Đi xa/Mới', Icon: PlaneIcon, color: 'text-purple-600 dark:text-purple-400' }
            ];

            const cleanNum = (num) => Number(num).toFixed(1).replace(/\.0$/, '');

            const getSpotifyEmbedUrl = (url) => {
                if (!url) return null;
                const trackMatch = url.match(/track\/([a-zA-Z0-9]+)/);
                if (trackMatch) return `https://open.spotify.com/embed/track/${trackMatch[1]}?utm_source=generator&theme=0`;
                return null;
            };

            const App = () => {
                const isDarkMode = true;

                // Tự động nhận diện thiết bị lúc mới vào (>=1024px là PC)
                const [isDesktopMode, setIsDesktopMode] = useState(() => {
                    const saved = localStorage.getItem('desktop_mode');
                    if (saved !== null) return JSON.parse(saved);
                    return window.innerWidth >= 1024;
                });
                useEffect(() => { localStorage.setItem('desktop_mode', JSON.stringify(isDesktopMode)); }, [isDesktopMode]);

                const [appMode, setAppMode] = useState('journal'); 
                const [currentView, setCurrentView] = useState('week'); 
                const [selectedDate, setSelectedDate] = useState(new Date());
                const [currentWeekStart, setCurrentWeekStart] = useState(getStartOfWeek(new Date()));
                const [currentMonthStart, setCurrentMonthStart] = useState(getStartOfMonth(new Date()));
                const [isHeaderCollapsed, setIsHeaderCollapsed] = useState(false);
                const lastScrollYRef = useRef(0);
                const mainSwipeRef = useRef({ startX: 0, startY: 0, ignore: false });
                
                const [activeFilter, setActiveFilter] = useState(null);
                const [journalDetailLevel, setJournalDetailLevel] = useState('simple');
                const [showFilterModal, setShowFilterModal] = useState(false);
                const [journalFilters, setJournalFilters] = useState({ 
                    query: '', moods: [], outings: [], workouts: [],
                    foodQuery: '', foodType: 'all', proType: 'all', sleepStart: 'all', sleepEnd: 'all'
                });
                
                const isFiltering = journalFilters.query.trim() || journalFilters.moods.length > 0 || journalFilters.outings.length > 0 || journalFilters.workouts.length > 0 || journalFilters.foodQuery.trim() || journalFilters.foodType !== 'all' || journalFilters.proType !== 'all' || journalFilters.sleepStart !== 'all' || journalFilters.sleepEnd !== 'all';

                const toggleFilterItem = (category, value) => {
                    setJournalFilters(prev => {
                        const current = prev[category];
                        if (current.includes(value)) return { ...prev, [category]: current.filter(v => v !== value) };
                        return { ...prev, [category]: [...current, value] };
                    });
                };

                const checkJournalMatch = (dKey) => {
                    if (!isFiltering) return true;
                    const { query, moods, outings, workouts, foodQuery, foodType, proType, sleepStart, sleepEnd } = journalFilters;
                    const sDay = statsByDate[dKey];
                    const fDay = foodsByDate[dKey] || [];
                    const wDay = workoutsByDate[dKey];
                    const slDay = sleepByDate[dKey] || [];

                    let matchQuery = true;
                    if (query.trim()) {
                        const q = query.toLowerCase().trim();
                        const matchSummary = sDay?.summary?.toLowerCase().includes(q);
                        const matchOuting = sDay?.outing && OUTINGS.find(o => o.val === sDay.outing)?.label.toLowerCase().includes(q);
                        matchQuery = matchSummary || matchOuting; // Đã tách food ra bộ lọc riêng
                    }

                    let matchMood = moods.length === 0 || (sDay && moods.includes(sDay.mood));
                    let matchOuting = outings.length === 0 || (sDay && outings.includes(sDay.outing));
                    let matchWorkout = workouts.length === 0 || (wDay && workouts.includes(wDay.type));

                    // Lọc Ẩm thực
                    let matchFood = true;
                    const fTotals = calculateTotals(fDay);
                    if (foodQuery.trim() && !fDay.some(f => f.name.toLowerCase().includes(foodQuery.toLowerCase().trim()))) matchFood = false;
                    if (foodType === 'cheatday' && (fDay.length === 0 || fTotals.kcal <= 2500)) matchFood = false;
                    if (foodType === 'normal' && (fDay.length === 0 || fTotals.kcal > 2500)) matchFood = false;
                    if (proType === 'enough' && (fDay.length === 0 || fTotals.protein < 115)) matchFood = false;
                    if (proType === 'lack' && (fDay.length === 0 || fTotals.protein >= 115)) matchFood = false;

                    // Lọc Giấc ngủ
                    let matchSleep = true;
                    const cWarn = getCircadianWarning(slDay);
                    const hasSleep = slDay.length > 0;
                    if (sleepStart === 'late' && (!hasSleep || (cWarn !== 'late_sleep' && cWarn !== 'bomb'))) matchSleep = false;
                    if (sleepStart === 'early' && (!hasSleep || cWarn === 'late_sleep' || cWarn === 'bomb')) matchSleep = false;
                    if (sleepEnd === 'late' && (!hasSleep || (cWarn !== 'late_wake' && cWarn !== 'bomb'))) matchSleep = false;
                    if (sleepEnd === 'early' && (!hasSleep || cWarn === 'late_wake' || cWarn === 'bomb')) matchSleep = false;

                    return matchQuery && matchMood && matchOuting && matchWorkout && matchFood && matchSleep;
                };
                
                const [lightboxImages, setLightboxImages] = useState(null);
                const [lightboxIndex, setLightboxIndex] = useState(0);
// Xử lý phím Esc và nút Back điện thoại cho Lightbox
                useEffect(() => {
                    if (lightboxImages) {
                        const handlePopState = () => setLightboxImages(null);
                        const handleKeyDown = (e) => {
                            if (e.key === 'Escape') window.history.back();
                        };
                        
                        window.history.pushState({ modal: 'lightbox' }, '', window.location.href);
                        window.addEventListener('popstate', handlePopState);
                        window.addEventListener('keydown', handleKeyDown);
                        
                        return () => {
                            window.removeEventListener('popstate', handlePopState);
                            window.removeEventListener('keydown', handleKeyDown);
                        };
                    }
                }, [lightboxImages]);

                useEffect(() => { setActiveFilter(null); }, [appMode, currentView]);

                const handleFilterClick = (filterName) => { setActiveFilter(prev => prev === filterName ? null : filterName); };
                
                const loadSafeJSON = (key) => {
                    try { 
                        const item = localStorage.getItem(key); 
                        let obj = item && item !== "undefined" && item !== "null" ? JSON.parse(item) : {}; 
                        const newObj = {};
                        for(let k in obj) {
                            const p = k.split('/');
                            if(p.length === 3) newObj[`${p[0].padStart(2,'0')}/${p[1].padStart(2,'0')}/${p[2]}`] = obj[k];
                            else newObj[k] = obj[k];
                        }
                        return newObj;
                    } catch (e) { return {}; }
                };

                const [foodsByDate, setFoodsByDate] = useState(() => loadSafeJSON('macro_foods'));
                const [sleepByDate, setSleepByDate] = useState(() => loadSafeJSON('macro_sleeps'));
                const [workoutsByDate, setWorkoutsByDate] = useState(() => loadSafeJSON('macro_workouts'));
                const [workoutTemplates, setWorkoutTemplates] = useState(() => loadSafeJSON('workout_templates'));
                const [statsByDate, setStatsByDate] = useState(() => loadSafeJSON('macro_stats'));

                // Chống lag: Debounce việc lưu dữ liệu lớn xuống localStorage 400ms

                const calculateWorkStats = (dayTodo) => {

                    const should = dayTodo?.should || [];

                    const mustDone = must.filter(t => t.done).length;
                    const shouldDone = should.filter(t => t.done).length;
                    const canDone = can.filter(t => t.done).length;
                    const totalPoints = (must.length * 3) + (should.length * 2) + (can.length * 1);
                    const earnedPoints = (mustDone * 3) + (shouldDone * 2) + (canDone * 1);
                    const totalTasks = must.length + should.length + can.length;
                    const totalDone = mustDone + shouldDone + canDone;
                    const pct = totalPoints > 0 ? Math.round((earnedPoints / totalPoints) * 100) : 0;
                    return {
                        pct,
                        earnedPoints,
                        totalPoints,
                        totalTasks,
                        totalDone,
                        mustDone,
                        mustTotal: must.length,
                        hasData: totalTasks > 0
                    };

                        return isEmpty && !fetchedWorkDatesRef.current.has(dKey);

                // Dời 1 chạm công việc đang kẹt lịch sang ngày mai & tự động lưu cả 2 ngày
                const handleMoveTodoToTomorrow = (category, taskId) => {

                const handleAddUrgent = async (content) => {

                const handleClearScratchpad = () => { handleUpdateScratchpad(''); };

                const handleScanFood = async () => {
                    if (!geminiApiKey) { showToast('Vui lòng nhập API Key trong Cài đặt!', 'error'); return; }
                    if (!imageBase64 && !foodDescription) { showToast('Vui lòng chọn ảnh hoặc nhập mô tả!', 'error'); return; }
                    setIsScanning(true);
                    try {
                        let parts = [{ text: `Phân tích món ăn sau và ước lượng calo, protein (g), carbs (g), fat (g). Dựa vào hình ảnh (nếu có) và mô tả: "${foodDescription || 'Không có'}". BẮT BUỘC chỉ trả về 1 object JSON thuần túy với định dạng: {"name": "Tên món", "kcal": số, "protein": số, "carbs": số, "fat": số}` }];
                        if (imageBase64) { parts.push({ inlineData: { mimeType: imageBase64.match(/[^:]\w+\/[\w-+\d.]+(?=;|,)/)[0], data: imageBase64.split(',')[1] } }); }
                        const payload = { contents: [{ role: "user", parts: parts }], systemInstruction: { parts: [{ text: "Phân tích ngầm tỷ lệ theo khối lượng. Tính: calo = protein*4 + carb*4 + fat*9." }] }, generationConfig: { responseMimeType: "application/json" } };
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${geminiApiKey.trim()}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        if (!response.ok) throw new Error(`Lỗi kết nối API (${response.status})`);
                        const result = await response.json();
                        if (result.candidates && result.candidates.length > 0) {
                            const data = JSON.parse(result.candidates[0].content.parts[0].text);
                            setFormData({ name: data.name || foodDescription, kcal: Math.round(data.kcal)||0, protein: cleanNum(data.protein)||0, carbs: cleanNum(data.carbs)||0, fat: cleanNum(data.fat)||0 });
                            setEntryMode('detail'); showToast('✨ Quét thành công!', 'success');

                const handleSyncPush = async (isSilent = false) => {
                    if(!gasUrl) { if(!isSilent) showToast('Vui lòng nhập link Script!', 'error'); return; }
                    if(!isSilent) setIsSyncing(true);
                    startSyncRing('push');
                    try {
                        const allDates = Array.from(new Set([...Object.keys(foodsByDate), ...Object.keys(sleepByDate)]));
                        const syncDataPayload = allDates.map(dKey => {
                            const fDay = foodsByDate[dKey] || []; const sDay = sleepByDate[dKey] || [];
                            const dNum = parseDateToNumber(dKey); const isNewEra = dNum >= 20260821; const tAll = calculateTotals(fDay);
                            const formatMeal = (mealName) => {
                                const mFoods = fDay.filter(f => f.meal === mealName);
                                if (mFoods.length === 0) return 'X';
                                if (isNewEra) {
                                    return mFoods.map(f => {
                                        const kcal = Math.round(f.kcal !== undefined ? f.kcal : (f.carbs*4 + f.protein*4 + f.fat*9));
                                        return `${f.name}: ${kcal} kcal | P: ${Math.round(f.protein)}g | C: ${Math.round(f.carbs)}g | F: ${Math.round(f.fat)}g`;
                                    }).join('\n');
                                } else {

                                    const names = mFoods.map(f => { tKc += Number(f.kcal !== undefined ? f.kcal : (f.carbs*4 + f.protein*4 + f.fat*9)); tPro += Number(f.protein); return f.name; });
                                    return `${names.join(', ')}: ${Math.round(tKc)} kcal + ${Math.round(tPro)} g protein`;

                        });
                        const finalPayload = syncDataPayload.filter(item => item.sang !== 'X' || item.trua !== 'X' || item.chieu !== 'X' || item.ngoai_le !== 'X' || item.ngu !== '');
                        // Thêm detail (cột H) và musicUrl (cột K) vào payload
                        const statsPayload = Object.keys(statsByDate).map(d => ({ date: d, mood: statsByDate[d].mood, outing: statsByDate[d].outing, detail: statsByDate[d].detail || '', summary: statsByDate[d].summary, images: (statsByDate[d].images || []).filter(img => img && typeof img === 'string'), musicUrl: statsByDate[d].musicUrl || '' }));
                        let formattedWorkouts = [];
                        Object.keys(workoutsByDate).forEach(wDate => {

                                    if (vSets.length > 0) {
                                        return { name: ex.name, sets: vSets.map(s => ({ reps: s.reps, weight: s.weight, unit: (s.unit || 'KG').toUpperCase() })) };

                                    if (ex.rawText && ex.rawText.trim() !== '' && ex.rawText.trim().toUpperCase() !== 'X') {

                                    return { name: ex.name, sets: [] };
                                });
                                // MÀNG LỌC DIỆT BÓNG MA: Tránh đẩy lịch rỗng (toàn X) lên làm mất dữ liệu
                                let hasRealData = false;

                                if (hasRealData || (wOut.note && wOut.note.trim() !== '')) {

                        const response = await fetch(gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ data: finalPayload, workoutsData: formattedWorkouts, statsData: statsPayload }) });
                        const res = await response.json();

                    } catch (e) { if(!isSilent) showToast('❌ Lỗi: ' + e.message, 'error'); }
                    finishSyncRing();
                    if(!isSilent) setIsSyncing(false);

                const handleSyncPull = async (autoUrl = null) => {

                    const parseRawDate = (raw) => {
                        if (!raw) return null; let s = String(raw).trim(); let p = s.split('/');

                        return s;

                    try {
                        const response = await fetch(targetUrl); const data = await response.json();

                                let newTemplates = {};

                                                            rP.split('+').forEach(r => parsedSets.push({ weight: wVal, unit: unit, reps: r.trim() }));
                                                        } else {
                                                            if (/^[\d+()a-zA-Z~.\-ữươ]+$/.test(pt)) {

                                                            }

                                                    if (isRaw) exes.push({ id: Date.now()+c, name: hName, rawText: cell, sets: [{ reps:'', weight:'', unit:'KG' }] });

                                                }

                                    });

                                });

                            const parseMealString = (mealName, mealString) => {

                                    const mOld = item.match(/^(.*?):\s*(\d+(?:\.\d+)?)\s*kcal\s*\+\s*(\d+(?:\.\d+)?)\s*g/i);

                                    if (dFoods.length > 0) f[dClean] = dFoods;

                            const lastScrollY = lastScrollYRef.current;
                            if (scrollTop > lastScrollY + 12 && scrollTop > 40) {
                                if (!isHeaderCollapsed) setIsHeaderCollapsed(true);
                            } else if (scrollTop < lastScrollY - 8 || scrollTop < 20) {
                                if (isHeaderCollapsed) setIsHeaderCollapsed(false);
                            }
                            lastScrollYRef.current = scrollTop;
                        }}
                        onTouchStart={(e) => {
                            if (!e.touches || e.touches.length !== 1) return;
                            const target = e.target;
                            const shouldIgnore = !!(target && target.closest && target.closest('.overflow-x-auto, .snap-x, input, textarea, .recharts-wrapper'));
                            mainSwipeRef.current = {
                                startX: e.touches[0].clientX,
                                startY: e.touches[0].clientY,
                                ignore: shouldIgnore
                            };
                        }}
                        onTouchEnd={(e) => {
                            if (mainSwipeRef.current.ignore || !e.changedTouches || e.changedTouches.length === 0) return;
                            const diffX = mainSwipeRef.current.startX - e.changedTouches[0].clientX;
                            const diffY = mainSwipeRef.current.startY - e.changedTouches[0].clientY;
                            if (Math.abs(diffX) > 65 && Math.abs(diffX) > Math.abs(diffY) * 1.8) {
                                if (diffX > 65) {
                                    currentView === 'day' ? changeDate(1) : currentView === 'week' ? changeWeek(1) : changeMonth(1);

                            }

                                                                }
                                                                if (e.key === 'Escape') setIsInsightExpanded(false);
                                                            }}
                                                            className="w-full bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-xl px-3 py-2 outline-none text-xs font-semibold text-slate-800 dark:text-zinc-200 placeholder-slate-400 dark:placeholder-zinc-500"
                                                        />
                                                    </div>
                                                )}

                                <div className="flex justify-between items-start mb-6 shrink-0">
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-800 dark:text-zinc-100 tracking-tight flex items-center gap-2">
                                            <div className="p-2 bg-blue-50 dark:bg-blue-500/10 rounded-xl"><ActivityIcon className="text-blue-500" size={20}/></div>
                                            Phân Tích
                                        </h2>
                                        <p className="text-sm font-bold text-slate-500 dark:text-zinc-400 mt-1.5">{chartExerciseName}</p>
                                    </div>
                                    <button onClick={() => setShowChartModal(false)} className="text-slate-400 bg-slate-100 dark:bg-zinc-800 p-2.5 rounded-full hover:bg-slate-200 dark:hover:bg-zinc-700 transition-all active:scale-90"><XIcon size={20} /></button>
                                </div>

                                {(() => {
                                    const validChartData = chartData.filter(d => d[chartMetric] > 0);
                                    const displayChartData = chartLimit === 'ALL' ? validChartData : validChartData.slice(-Math.max(2, chartLimit));
                                    
                                    return (
                                        <div className="space-y-5">
                                            <div className="flex bg-slate-100 dark:bg-zinc-800/80 p-1.5 rounded-2xl w-full border border-slate-200/50 dark:border-zinc-700/50 shadow-inner">
                                                <button onClick={() => setChartMetric('maxWeight')} className={`flex-1 py-2.5 rounded-xl text-xs font-black transition-all ${chartMetric === 'maxWeight' ? 'bg-blue-500 text-white shadow-md shadow-blue-500/30 scale-105' : 'text-slate-500 dark:text-zinc-400 hover:text-slate-700'}`}>Tạ Nặng Nhất</button>
                                                <button onClick={() => setChartMetric('volume')} className={`flex-1 py-2.5 rounded-xl text-xs font-black transition-all ${chartMetric === 'volume' ? 'bg-emerald-500 text-white shadow-md shadow-emerald-500/30 scale-105' : 'text-slate-500 dark:text-zinc-400 hover:text-slate-700'}`}>Tổng Volume</button>
                                            </div>

                                            <div className="flex justify-between items-center px-1">
                                                <span className="text-[10px] font-black text-slate-400 dark:text-zinc-500 uppercase tracking-widest flex items-center gap-1.5"><FilterIcon size={12}/> Hiển thị</span>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => setChartLimit(prev => prev === 'ALL' ? 15 : 'ALL')} className={`px-3 py-1.5 rounded-xl text-[10px] font-black uppercase transition-all border ${chartLimit === 'ALL' ? 'bg-slate-800 text-white border-slate-800 dark:bg-zinc-200 dark:text-zinc-900 shadow-md scale-105' : 'bg-transparent text-slate-500 border-slate-200 dark:border-zinc-700 hover:bg-slate-100 dark:hover:bg-zinc-800'}`}>Tất cả</button>
                                                    
                                                    <div className={`flex items-center bg-slate-100 dark:bg-zinc-800/80 rounded-xl border transition-all ${chartLimit !== 'ALL' ? 'border-slate-300 dark:border-zinc-600 ring-2 ring-slate-200 dark:ring-zinc-700/50 shadow-sm' : 'border-slate-200 dark:border-zinc-700 opacity-60 hover:opacity-100 cursor-pointer'}`}>
                                                        <button onClick={() => setChartLimit(prev => prev === 'ALL' ? 14 : Math.max(2, prev - 1))} className="w-8 h-7 flex items-center justify-center text-slate-500 hover:text-slate-800 dark:hover:text-zinc-200 active:scale-90 font-black text-lg leading-none">-</button>
                                                        <div onClick={() => chartLimit === 'ALL' && setChartLimit(15)} className="w-16 h-7 flex items-center justify-center text-xs font-black text-slate-700 dark:text-zinc-300 border-x border-slate-200 dark:border-zinc-700 cursor-pointer hover:bg-slate-200 dark:hover:bg-zinc-700 transition-colors">
                                                            {chartLimit === 'ALL' ? 15 : chartLimit} <span className="text-[9px] opacity-70 font-bold ml-0.5">LẦN</span>
                                                        </div>
                                                        <button onClick={() => setChartLimit(prev => prev === 'ALL' ? 16 : prev + 1)} className="w-8 h-7 flex items-center justify-center text-slate-500 hover:text-slate-800 dark:hover:text-zinc-200 active:scale-90 font-black text-lg leading-none">+</button>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="h-64 w-full bg-slate-50 dark:bg-zinc-950/50 rounded-[2rem] border border-slate-100 dark:border-zinc-800 p-4 pt-6">
                                                {LineChart && displayChartData.length > 0 ? (
                                                    <ResponsiveContainer width="100%" height="100%">
                                                        <LineChart data={displayChartData}>
                                                            <CartesianGrid strokeDasharray="3 3" stroke={isDarkMode ? '#27272a' : '#f1f5f9'} vertical={false} />
                                                            <XAxis dataKey="date" stroke={isDarkMode ? '#71717a' : '#94a3b8'} fontSize={10} axisLine={false} tickLine={false} dy={10} />
                                                            <YAxis stroke={isDarkMode ? '#71717a' : '#94a3b8'} fontSize={10} axisLine={false} tickLine={false} dx={-10} width={30} />
                                                            <Tooltip 
                                                                contentStyle={{ backgroundColor: isDarkMode ? '#18181b' : '#ffffff', borderRadius: '12px', border: isDarkMode ? '1px solid #3f3f46' : '1px solid #e2e8f0', boxShadow: '0 10px 15px -3px rgba(0, 0, 0, 0.1)' }}
                                                                itemStyle={{ color: chartMetric === 'maxWeight' ? '#3b82f6' : '#10b981', fontWeight: '900' }}
                                                                formatter={(value) => [value, chartMetric === 'maxWeight' ? 'Mức Tạ' : 'Volume']}
                                                                labelStyle={{ color: isDarkMode ? '#a1a1aa' : '#64748b', fontWeight: 'bold', marginBottom: '4px' }}
                                                            />
                                                            <Line type="monotone" dataKey={chartMetric} stroke={chartMetric === 'maxWeight' ? '#3b82f6' : '#10b981'} strokeWidth={4} dot={{ r: 4, strokeWidth: 2, fill: isDarkMode ? '#18181b' : '#ffffff' }} activeDot={{ r: 6, strokeWidth: 0 }} />
                                                        </LineChart>
                                                    </ResponsiveContainer>
                                                ) : (
                                                    <div className="flex flex-col h-full items-center justify-center text-slate-400 dark:text-zinc-600 font-bold text-sm gap-2">
                                                        <ActivityIcon size={32} className="opacity-20"/>
                                                        {displayChartData.length === 0 ? 'Không có dữ liệu hợp lệ' : 'Đang tải biểu đồ...'}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        </div>
                    )}
                    {/* Modal Xóa Buổi Tập */}
                    {showDeleteConfirm && (
                        <div className="fixed inset-0 z-[100] flex justify-center items-center p-4">
                            <div className="absolute inset-0 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm modal-overlay" onClick={() => setShowDeleteConfirm(false)}></div>
                            <div className="bg-white dark:bg-zinc-900 w-full max-w-sm rounded-[2rem] shadow-2xl p-8 text-center transition-colors relative z-10 bottom-sheet">
                                <div className="w-20 h-20 bg-red-50 dark:bg-red-500/10 border border-red-100 dark:border-red-500/20 text-red-500 dark:text-red-400 rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner"><Trash2Icon size={36} /></div>
                                <h3 className="text-2xl font-black text-slate-800 dark:text-zinc-100 mb-3 tracking-tight">Xóa buổi tập?</h3>
                                <p className="text-slate-500 dark:text-zinc-400 text-sm mb-8 font-medium">Bạn có chắc chắn muốn xóa toàn bộ dữ liệu của buổi tập này không? Hành động này không thể hoàn tác.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowDeleteConfirm(false)} className="flex-1 py-4 bg-slate-100 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300 rounded-2xl font-bold transition-all active:scale-95 shadow-sm">Hủy</button>
                                    <button onClick={handleDeleteWorkout} className="flex-1 py-4 bg-red-500 hover:bg-red-600 text-white rounded-2xl font-bold shadow-lg shadow-red-500/30 transition-all active:scale-95">Xóa ngay</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {/* Modal Tính Trung Bình */}
                    {showAvgModal && (
                        <div className="fixed inset-0 z-[200] flex justify-center items-end sm:items-center">
                            <div className="absolute inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-sm modal-overlay" onClick={() => setShowAvgModal(false)}></div>
                            <div className="w-full max-w-md bg-white dark:bg-zinc-900 rounded-t-[2.5rem] sm:rounded-[2.5rem] shadow-2xl p-6 relative bottom-sheet flex flex-col border-t border-slate-100 dark:border-zinc-800">
                                <div className="w-12 h-1.5 bg-slate-200 dark:bg-zinc-800 rounded-full mx-auto mb-6 sm:hidden shrink-0"></div>
                                <div className="flex justify-between items-start mb-6 shrink-0">
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-800 dark:text-zinc-100 tracking-tight flex items-center gap-2">
                                            <div className="p-2 bg-blue-50 dark:bg-blue-500/10 rounded-xl"><ActivityIcon className="text-blue-500" size={20}/></div>
                                            Chỉ số Trung bình
                                        </h2>
                                        <p className="text-sm font-bold text-slate-500 dark:text-zinc-400 mt-1.5">Tính toán theo khoảng ngày</p>
                                    </div>
                                    <button onClick={() => setShowAvgModal(false)} className="text-slate-400 bg-slate-100 dark:bg-zinc-800 p-2.5 rounded-full hover:bg-slate-200 dark:hover:bg-zinc-700 transition-all active:scale-90"><XIcon size={20} /></button>
                                </div>

                                <form onSubmit={calculateAverages} className="space-y-4 mb-6">
                                    <div className="flex gap-2 p-1.5 bg-slate-100 dark:bg-zinc-800/80 rounded-2xl border border-slate-200/50 dark:border-zinc-700/50 shadow-inner">
                                        <div className="flex-1 flex items-center bg-white dark:bg-zinc-900 rounded-[0.8rem] shadow-sm border border-slate-200/80 dark:border-zinc-700 overflow-hidden">
                                            <button type="button" onClick={() => applyAvgPreset('week', avgPresetMode === 'week' ? avgOffset - 1 : -1)} className="p-3 text-slate-400 hover:text-blue-500 hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors active:scale-90"><ChevronLeftIcon size={16}/></button>
                                            <button type="button" onClick={() => applyAvgPreset('week', 0)} className={`flex-1 py-3 text-[10px] font-black uppercase text-center transition-colors ${avgPresetMode === 'week' ? 'text-blue-500' : 'text-slate-500 dark:text-zinc-400'}`}>1 Tuần {avgPresetMode === 'week' && avgOffset !== 0 ? `(${avgOffset})` : ''}</button>
                                            <button type="button" onClick={() => applyAvgPreset('week', avgPresetMode === 'week' ? avgOffset + 1 : 1)} disabled={avgPresetMode === 'week' && avgOffset >= 0} className="p-3 text-slate-400 hover:text-blue-500 hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors active:scale-90 disabled:opacity-20"><ChevronRightIcon size={16}/></button>
                                        </div>
                                        <div className="flex-1 flex items-center bg-white dark:bg-zinc-900 rounded-[0.8rem] shadow-sm border border-slate-200/80 dark:border-zinc-700 overflow-hidden">
                                            <button type="button" onClick={() => applyAvgPreset('month', avgPresetMode === 'month' ? avgOffset - 1 : -1)} className="p-3 text-slate-400 hover:text-blue-500 hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors active:scale-90"><ChevronLeftIcon size={16}/></button>
                                            <button type="button" onClick={() => applyAvgPreset('month', 0)} className={`flex-1 py-3 text-[10px] font-black uppercase text-center transition-colors ${avgPresetMode === 'month' ? 'text-blue-500' : 'text-slate-500 dark:text-zinc-400'}`}>1 Tháng {avgPresetMode === 'month' && avgOffset !== 0 ? `(${avgOffset})` : ''}</button>
                                            <button type="button" onClick={() => applyAvgPreset('month', avgPresetMode === 'month' ? avgOffset + 1 : 1)} disabled={avgPresetMode === 'month' && avgOffset >= 0} className="p-3 text-slate-400 hover:text-blue-500 hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors active:scale-90 disabled:opacity-20"><ChevronRightIcon size={16}/></button>
                                        </div>
                                    </div>
                                    <div className="flex gap-3">
                                        <div className="flex-1 bg-slate-50 dark:bg-zinc-800/50 p-3.5 rounded-2xl border border-slate-100 dark:border-zinc-700/50">
                                            <label className="block text-[9px] font-black text-slate-500 dark:text-zinc-400 uppercase tracking-widest mb-1.5">Từ ngày</label>
                                            <input type="date" value={avgStartDate} onChange={e=>{setAvgStartDate(e.target.value); setAvgPresetMode('custom');}} className="w-full bg-transparent outline-none text-sm font-bold text-slate-800 dark:text-zinc-100 dark:[color-scheme:dark]" required/>
                                        </div>
                                        <div className="flex-1 bg-slate-50 dark:bg-zinc-800/50 p-3.5 rounded-2xl border border-slate-100 dark:border-zinc-700/50">
                                            <label className="block text-[9px] font-black text-slate-500 dark:text-zinc-400 uppercase tracking-widest mb-1.5">Đến ngày</label>
                                            <input type="date" value={avgEndDate} onChange={e=>{setAvgEndDate(e.target.value); setAvgPresetMode('custom');}} className="w-full bg-transparent outline-none text-sm font-bold text-slate-800 dark:text-zinc-100 dark:[color-scheme:dark]" required/>
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full py-3.5 bg-blue-500 hover:bg-blue-600 text-white font-black rounded-xl shadow-md shadow-blue-500/30 active:scale-95 transition-all">Tính Toán</button>
                                </form>

                                {avgResult && (
                                    <div className="bg-slate-800 dark:bg-black p-5 rounded-[2rem] text-white shadow-inner border border-slate-700 dark:border-zinc-800 animate-[fadeScale_0.2s_ease-out]">
                                        <p className="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 border-b border-slate-700 pb-3 flex items-center justify-between">
                                            <span>Kết quả ({appMode === 'macro' ? avgResult.mDays : avgResult.sDays} ngày có dl)</span>
                                            <CheckCircleIcon size={16} className="text-emerald-500"/>
                                        </p>
                                        
                                        {appMode === 'macro' && (
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <p className="text-[10px] font-black text-emerald-400 uppercase tracking-widest mb-1">Kcal TB</p>
                                                    <p className="text-3xl font-black text-emerald-50">{avgResult.kcal}</p>
                                                </div>
                                                <div>
                                                    <p className="text-[10px] font-black text-red-400 uppercase tracking-widest mb-1">Protein TB</p>
                                                    <p className="text-3xl font-black text-red-50">{avgResult.pro}<span className="text-sm ml-1">g</span></p>
                                                </div>
                                            </div>
                                        )}

                                        {appMode === 'sleep' && (
                                            <div className="space-y-4">
                                                <div className="flex justify-between items-center bg-white/5 p-3 rounded-xl">
                                                    <span className="text-[11px] font-black text-slate-300 uppercase tracking-widest">Ngủ lúc</span>
                                                    <span className="text-xl font-black text-indigo-300">{avgResult.sleep}</span>
                                                </div>
                                                <div className="flex justify-between items-center bg-white/5 p-3 rounded-xl">
                                                    <span className="text-[11px] font-black text-slate-300 uppercase tracking-widest">Dậy lúc</span>
                                                    <span className="text-xl font-black text-orange-300">{avgResult.wake}</span>
                                                </div>
                                                <div className="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/10 shadow-sm">
                                                    <span className="text-[11px] font-black text-slate-300 uppercase tracking-widest">Thời lượng TB</span>
                                                    <span className="text-xl font-black text-emerald-400">{formatDuration(avgResult.dur)}</span>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                    {/* Modal Cài Đặt Đồng Bộ */}
                    {showSettings && (
                        <div className="fixed inset-0 z-[100] flex justify-center items-center p-4">
                            <div className="absolute inset-0 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm modal-overlay" onClick={() => setShowSettings(false)}></div>
                            <div className="bg-white dark:bg-zinc-900 w-full max-w-md rounded-[2.5rem] shadow-2xl p-6 transition-colors relative z-10 bottom-sheet">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="text-2xl font-black text-slate-800 dark:text-zinc-100 flex items-center gap-3 tracking-tight">
                                        <div className="p-2 bg-blue-50 dark:bg-blue-500/10 rounded-xl"><CloudIcon className="text-blue-500" size={24}/></div>
                                        Đồng bộ Dữ liệu
                                    </h2>
                                    <button onClick={() => setShowSettings(false)} className="text-slate-400 bg-slate-100 dark:bg-zinc-800 p-2.5 rounded-full hover:bg-slate-200 dark:hover:bg-zinc-700 transition-all active:scale-90"><XIcon size={20} /></button>
                                </div>
                                <div className="space-y-6">
                                    <div className="bg-slate-50 dark:bg-zinc-800/50 p-5 rounded-[1.5rem] border border-slate-100 dark:border-zinc-700/50 shadow-sm">
                                        <label className="block text-[10px] font-black text-slate-500 dark:text-zinc-400 uppercase tracking-widest mb-3">Link Apps Script (Web App URL)</label>
                                        <input type="text" value={gasUrl} onChange={(e) => setGasUrl(e.target.value)} placeholder="https://script.google.com/macros/s/..." className="w-full bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-xl px-4 py-3.5 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 text-sm font-semibold text-slate-800 dark:text-zinc-200 transition-all shadow-sm" />
                                    </div>
                                    <div className="bg-slate-50 dark:bg-zinc-800/50 p-5 rounded-[1.5rem] border border-slate-100 dark:border-zinc-700/50 shadow-sm">
                                        <label className="block text-[10px] font-black text-slate-500 dark:text-zinc-400 uppercase tracking-widest mb-3 flex items-center gap-1.5"><SparklesIcon size={14} className="text-emerald-500"/> Gemini API Key</label>
                                        <input type="text" value={geminiApiKey} onChange={(e) => setGeminiApiKey(e.target.value)} placeholder="Nhập API Key để dùng AI..." className="w-full bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-xl px-4 py-3.5 outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 text-sm font-semibold text-slate-800 dark:text-zinc-200 transition-all shadow-sm" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 mt-2">
                                        <button onClick={() => { setIsAutoSyncEnabled(true); setHasUnsavedChanges(false); handleSyncPush(false); }} disabled={isSyncing} className="py-4 bg-blue-500 hover:bg-blue-600 text-white rounded-2xl font-black flex flex-col items-center justify-center gap-1 disabled:opacity-50 transition-all active:scale-95 shadow-xl shadow-blue-500/30">
                                            <UploadIcon size={24} className="mb-1" />
                                            <span className="text-xs uppercase tracking-widest">Đẩy lên Sheet</span>
                                        </button>
                                        <button onClick={() => { setIsAutoSyncEnabled(true); setHasUnsavedChanges(false); handleSyncPull(); }} disabled={isSyncing} className="py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-black flex flex-col items-center justify-center gap-1 disabled:opacity-50 transition-all active:scale-95 shadow-xl shadow-emerald-500/30">
                                            <DownloadIcon size={24} className="mb-1" />
                                            <span className="text-xs uppercase tracking-widest">Tải từ Sheet</span>
                                        </button>
                                    </div>
                                    {isSyncing && (
                                        <div className="bg-blue-50 dark:bg-blue-500/10 border border-blue-100 dark:border-blue-500/20 p-4 rounded-xl flex items-center justify-center gap-3">
                                            <LoaderIcon className="animate-spin text-blue-500" size={20} />
                                            <p className="text-blue-600 dark:text-blue-400 text-sm font-bold tracking-wide">Đang xử lý đồng bộ...</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* LIGHTBOX (TRÌNH XEM ẢNH FULL MÀN HÌNH) */}
                    {lightboxImages && lightboxImages.length > 0 && (
                        <div className="fixed inset-0 z-[200] bg-black/95 flex flex-col justify-center items-center backdrop-blur-md animate-[fadeIn_0.2s_ease-out]" onClick={() => window.history.back()}>
                            <div className="absolute top-6 right-6 flex gap-4 z-50">
                                <span className="text-white font-black tracking-widest bg-white/10 px-4 py-2 rounded-2xl backdrop-blur text-sm border border-white/10">{lightboxIndex + 1} / {lightboxImages.length}</span>
                                <button onClick={(e) => { e.stopPropagation(); window.history.back(); }} className="text-white bg-white/10 p-2.5 rounded-full hover:bg-white/20 backdrop-blur border border-white/10 transition-all active:scale-90"><XIcon size={20}/></button>
                            </div>

                            <div className="relative w-full max-w-4xl flex justify-center items-center h-full px-4" onClick={(e) => e.stopPropagation()}>
                                {lightboxImages.length > 1 && (
                                    <button onClick={(e) => { e.stopPropagation(); setLightboxIndex(prev => prev === 0 ? lightboxImages.length - 1 : prev - 1); }} className="absolute left-4 top-1/2 -translate-y-1/2 text-white bg-white/10 p-4 rounded-full hover:bg-white/20 backdrop-blur z-50 border border-white/10 transition-all active:scale-90"><ChevronLeftIcon size={32}/></button>



                                )}
                                
                                <img src={lightboxImages[lightboxIndex]} className="max-w-full max-h-[75vh] object-contain rounded-2xl shadow-2xl transition-transform duration-300" />
                                
                                {lightboxImages.length > 1 && (
                                    <button onClick={(e) => { e.stopPropagation(); setLightboxIndex(prev => prev === lightboxImages.length - 1 ? 0 : prev + 1); }} className="absolute right-4 top-1/2 -translate-y-1/2 text-white bg-white/10 p-4 rounded-full hover:bg-white/20 backdrop-blur z-50 border border-white/10 transition-all active:scale-90"><ChevronRightIcon size={32}/></button>
                                )}
                            </div>
                            
                            {/* Thumbnails */}
                            <div className="absolute bottom-8 flex gap-3 overflow-x-auto max-w-full px-6 no-scrollbar" onClick={(e) => e.stopPropagation()}>
                                {lightboxImages.map((img, i) => (
                                    <button key={i} onClick={() => setLightboxIndex(i)} className={`relative shrink-0 rounded-xl overflow-hidden transition-all ${i === lightboxIndex ? 'ring-2 ring-white scale-110 shadow-xl' : 'opacity-50 hover:opacity-100'}`}>
                                        <img src={img} className="w-16 h-16 object-cover" />
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
            
        } catch (error) {
            console.error(error);
        }
    </script>
</body>
</html>
