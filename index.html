<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calasu Life Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {},
            },
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide-react@0.292.0/dist/umd/lucide-react.js"></script>

    <style>
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastSlide { from { transform: translateX(-50%) translateY(100px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
        @keyframes flashRed { 0%, 100% { background-color: #fee2e2; color: #ef4444; } 50% { background-color: #ef4444; color: white; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="time"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; transition: 0.2s; }
        input[type="time"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        body { -webkit-tap-highlight-color: transparent; background-color: #020617; }
        .timer-done { animation: flashRed 1s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        try {
            /* STREAMING_CHUNK:Khởi tạo thư viện Icon */
            let IconLib = window.lucideReact;
            
            if (!IconLib) {
                const E = (char) => ({ size, className }) => <span className={className} style={{ fontSize: size ? size * 0.8 : 'inherit', lineHeight: 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>{char}</span>;
                IconLib = {
                    Calendar: E("📅"), Plus: E("➕"), Trash2: E("🗑️"), Camera: E("📷"), Sparkles: E("✨"),
                    Wheat: E("🌾"), Beef: E("🥩"), Pencil: E("✏️"), Sunrise: E("🌅"), Sunset: E("🌇"),
                    Coffee: E("☕"), Dumbbell: E("🏋️"), X: E("❌"), ChevronLeft: E("◀️"), ChevronRight: E("▶️"),
                    Utensils: E("🍽️"), Moon: E("🌙"), Flame: E("🔥"), Droplet: E("💧"), Sun: E("☀️"),
                    Clock: E("🕒"), CheckCircle: E("✅"), Loader: E("⏳"), Activity: E("📈"), Image: E("🖼️"),
                    Cloud: E("☁️"), Download: E("⬇️"), Upload: E("⬆️"), Skull: E("💀"), Bomb: E("💣"), Heart: E("💚"), AlertTriangle: E("❗"), XCircle: E("❌"),
                    Timer: E("⏱️"), Book: E("📓"), Home: E("🏠"), Plane: E("✈️"), Smile: E("😊"), Frown: E("🙁"), Brain: E("🧠"), FileText: E("📝")
                };
            }

            const {
                Calendar: CalendarIcon, Plus: PlusIcon, Trash2: Trash2Icon, Camera: CameraIcon, Sparkles: SparklesIcon,
                Wheat: WheatIcon, Beef: BeefIcon, Pencil: PencilIcon, Sunrise: SunriseIcon, Sunset: SunsetIcon, Coffee: CoffeeIcon,
                Dumbbell: DumbbellIcon, X: XIcon, ChevronLeft: ChevronLeftIcon, ChevronRight: ChevronRightIcon,
                Utensils: UtensilsIcon, Moon: MoonIcon, Flame: FlameIcon, Droplet: DropletIcon, Sun: SunIcon,
                Clock: ClockIcon, CheckCircle: CheckCircleIcon, Loader: LoaderIcon, Activity: ActivityIcon, Image: ImageIcon,
                Cloud: CloudIcon, Download: DownloadIcon, Upload: UploadIcon, Skull: SkullIcon, Bomb: BombIcon, Heart: HeartIcon, AlertTriangle: AlertIcon, XCircle: XCircleIcon,
                Timer: TimerIcon, Book: BookIcon, Home: HomeIcon, Plane: PlaneIcon, Smile: SmileIcon, Frown: FrownIcon, Brain: BrainIcon, FileText: FileTextIcon
            } = IconLib;

            const { useState, useEffect, useRef } = React;
            
            /* STREAMING_CHUNK:Helper Logic Ngày tháng và Màu sắc */
            const VN_DAYS = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
            
            const formatDate = (date) => {
                const d = String(date.getDate()).padStart(2, '0');
                const m = String(date.getMonth() + 1).padStart(2, '0');
                return `${d}/${m}/${date.getFullYear()}`;
            };
            
            const getStartOfWeek = (date) => {
                const d = new Date(date);
                const day = d.getDay();
                return new Date(d.setDate(d.getDate() - day + (day === 0 ? -6 : 1)));
            };
            
            const getStartOfMonth = (date) => new Date(date.getFullYear(), date.getMonth(), 1);
            
            const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            
            const parseDateToNumber = (dateStr) => {
                if(!dateStr) return 0;
                const p = dateStr.split('/');
                if(p.length !== 3) return 0;
                return parseInt(p[2])*10000 + parseInt(p[1])*100 + parseInt(p[0]);
            };

            const getMacroStatus = (kcal, pro) => {
                if (!kcal && !pro) return null;
                let pScore = pro >= 115 ? 3 : (pro >= 90 ? 2 : 1);
                let cScore = kcal <= 2100 ? 3 : (kcal <= 2500 ? 2 : 1);
                let total = pScore + cScore;
                if (total === 6) return { bg: 'bg-emerald-500', border: 'border-emerald-600', text: 'text-white' };
                if (total >= 4) return { bg: 'bg-yellow-400', border: 'border-yellow-500', text: 'text-slate-800 dark:text-slate-900' };
                if (total === 3) return { bg: 'bg-red-500', border: 'border-red-600', text: 'text-white' };
                return { bg: 'bg-slate-800 dark:bg-slate-700', border: 'border-slate-900 dark:border-slate-600', text: 'text-white' };
            };

            const getSleepStatus = (mins) => {
                if (!mins || mins === 0) return null;
                if (mins >= 450) return { bg: 'bg-emerald-500', border: 'border-emerald-600', text: 'text-white' };
                if (mins >= 360) return { bg: 'bg-yellow-400', border: 'border-yellow-500', text: 'text-slate-800 dark:text-slate-900' };
                return { bg: 'bg-red-500', border: 'border-red-600', text: 'text-white' };
            };

            const getWorkoutColor = (type) => {
                if(!type) return { fill: 'bg-slate-500 dark:bg-slate-600', text: 'text-slate-600 dark:text-slate-400', border: 'border-slate-500 dark:border-slate-600', textLight: 'text-white' };
                switch(type) {
                    case 'Upper': return { text: 'text-orange-600 dark:text-orange-400', fill: 'bg-orange-500', border: 'border-orange-500', textLight: 'text-white' };
                    case 'Lower': return { text: 'text-yellow-600 dark:text-yellow-400', fill: 'bg-yellow-400', border: 'border-yellow-500', textLight: 'text-slate-800 dark:text-slate-900' };
                    case 'Push': return { text: 'text-emerald-600 dark:text-emerald-400', fill: 'bg-emerald-500', border: 'border-emerald-500', textLight: 'text-white' };
                    case 'Pull': return { text: 'text-blue-600 dark:text-blue-400', fill: 'bg-blue-500', border: 'border-blue-500', textLight: 'text-white' };
                    case 'Leg': return { text: 'text-purple-600 dark:text-purple-400', fill: 'bg-purple-500', border: 'border-purple-500', textLight: 'text-white' };
                    default: return { text: 'text-slate-600 dark:text-slate-400', fill: 'bg-slate-500 dark:bg-slate-600', border: 'border-slate-500 dark:border-slate-600', textLight: 'text-white' };
                }
            };

            /* STREAMING_CHUNK:Thang đo Cảnh báo & Nhật Ký */
            const getCircadianWarning = (sleeps) => {
                if (!sleeps || sleeps.length === 0) return null;
                const mainSleep = sleeps[sleeps.length - 1];
                if (!mainSleep?.sleepTime || !mainSleep?.wakeTime) return null;
                const [sH, sM] = mainSleep.sleepTime.split(':').map(Number);
                const [wH, wM] = mainSleep.wakeTime.split(':').map(Number);
                let isLateSleep = false;
                if (sH >= 0 && sH <= 5) { if (sH === 0 && sM === 0) isLateSleep = false; else isLateSleep = true; }
                const isLateWake = (wH > 7) || (wH === 7 && wM > 0);
                if (isLateSleep && isLateWake) return 'bomb';
                if (isLateSleep) return 'late_sleep';
                if (isLateWake) return 'late_wake';
                return 'heart';
            };

            const renderCircadianIcon = (type, size = 14) => {
                const baseClass = "bg-white dark:bg-slate-800 backdrop-blur-sm rounded-full p-0.5 shadow-sm inline-flex items-center justify-center border border-slate-200 dark:border-slate-700 z-20";
                if (type === 'bomb') return <div className={baseClass}><BombIcon size={size} className="text-slate-800 dark:text-slate-200" /></div>;
                if (type === 'late_sleep') return <div className={baseClass}><AlertIcon size={size} className="text-red-500 dark:text-red-400" /></div>;
                if (type === 'late_wake') return <div className={baseClass}><XCircleIcon size={size} className="text-red-500 dark:text-red-400" /></div>;
                if (type === 'heart') return <div className={baseClass}><HeartIcon size={size} className="text-emerald-500 dark:text-emerald-400" /></div>;
                return null;
            };

            const MOODS = [
                { val: 0, label: 'Tồi tệ', color: '#4A1525', twBg: 'bg-[#4A1525]', twText: 'text-white' },
                { val: 1, label: 'Mệt mỏi', color: '#B45309', twBg: 'bg-amber-700', twText: 'text-white' },
                { val: 2, label: 'Chán ngắt', color: '#EAB308', twBg: 'bg-yellow-500', twText: 'text-slate-900' },
                { val: 3, label: 'Bình ổn', color: '#0284C7', twBg: 'bg-sky-600', twText: 'text-white' },
                { val: 4, label: 'Vui vẻ', color: '#16A34A', twBg: 'bg-green-600', twText: 'text-white' },
                { val: 5, label: 'Thăng hoa', color: '#9333EA', twBg: 'bg-purple-600', twText: 'text-white' }
            ];

            const OUTINGS = [
                { val: 1, label: 'Ở nhà/Gym', Icon: HomeIcon, color: 'text-blue-500 dark:text-blue-400' },
                { val: 2, label: 'Học/Làm', Icon: BookIcon, color: 'text-yellow-600 dark:text-yellow-400' },
                { val: 3, label: 'Đi chơi', Icon: CoffeeIcon, color: 'text-green-600 dark:text-green-400' },
                { val: 4, label: 'Đi xa/Mới', Icon: PlaneIcon, color: 'text-purple-600 dark:text-purple-400' }
            ];

            const getDopamineColor = (score) => {
                if (score === 0) return { border: 'border-green-500 dark:border-green-400', text: 'text-green-500 dark:text-green-400', bg: 'bg-green-50 dark:bg-green-900/20' };
                if (score < 5) return { border: 'border-yellow-400 dark:border-yellow-500', text: 'text-yellow-600 dark:text-yellow-400', bg: 'bg-yellow-50 dark:bg-yellow-900/20' };
                if (score < 10) return { border: 'border-orange-500 dark:border-orange-400', text: 'text-orange-600 dark:text-orange-400', bg: 'bg-orange-50 dark:bg-orange-900/20' };
                return { border: 'border-red-500 dark:border-red-400', text: 'text-red-600 dark:text-red-400', bg: 'bg-red-50 dark:bg-red-900/20' };
            };

            const cleanNum = (num) => Number(num).toFixed(1).replace(/\.0$/, '');

            /* STREAMING_CHUNK:Khởi tạo Component App Chính */
            const App = () => {
                const [isDarkMode, setIsDarkMode] = useState(() => {
                    const saved = localStorage.getItem('theme_mode');
                    return saved !== null ? JSON.parse(saved) : true; 
                });
                useEffect(() => { localStorage.setItem('theme_mode', JSON.stringify(isDarkMode)); }, [isDarkMode]);

                const [appMode, setAppMode] = useState('stat'); 
                const [currentView, setCurrentView] = useState('day'); 
                const [selectedDate, setSelectedDate] = useState(new Date());
                const [currentWeekStart, setCurrentWeekStart] = useState(getStartOfWeek(new Date()));
                const [currentMonthStart, setCurrentMonthStart] = useState(getStartOfMonth(new Date()));
                
                const [activeFilter, setActiveFilter] = useState(null);
                const [statViewMode, setStatViewMode] = useState('all'); 
                
                const [dayDetailModal, setDayDetailModal] = useState(null);

                useEffect(() => { setActiveFilter(null); }, [appMode, currentView]);

                const handleFilterClick = (filterName) => {
                    setActiveFilter(prev => prev === filterName ? null : filterName);
                };
                
                const loadSafeJSON = (key) => {
                    try { 
                        const item = localStorage.getItem(key); 
                        let obj = item && item !== "undefined" && item !== "null" ? JSON.parse(item) : {}; 
                        const newObj = {};
                        for(let k in obj) {
                            const p = k.split('/');
                            if(p.length === 3) newObj[`${p[0].padStart(2,'0')}/${p[1].padStart(2,'0')}/${p[2]}`] = obj[k];
                            else newObj[k] = obj[k];
                        }
                        return newObj;
                    } catch (e) { return {}; }
                };

                const [foodsByDate, setFoodsByDate] = useState(() => loadSafeJSON('macro_foods'));
                const [sleepByDate, setSleepByDate] = useState(() => loadSafeJSON('macro_sleeps'));
                const [workoutsByDate, setWorkoutsByDate] = useState(() => loadSafeJSON('macro_workouts'));
                const [statsByDate, setStatsByDate] = useState(() => loadSafeJSON('macro_stats'));

                useEffect(() => { localStorage.setItem('macro_foods', JSON.stringify(foodsByDate)); }, [foodsByDate]);
                useEffect(() => { localStorage.setItem('macro_sleeps', JSON.stringify(sleepByDate)); }, [sleepByDate]);
                useEffect(() => { localStorage.setItem('macro_workouts', JSON.stringify(workoutsByDate)); }, [workoutsByDate]);
                useEffect(() => { localStorage.setItem('macro_stats', JSON.stringify(statsByDate)); }, [statsByDate]);

                const [toast, setToast] = useState(null);
                const showToast = (msg, type = 'success') => { setToast({ msg, type }); setTimeout(() => setToast(null), 5000); };

                const defaultScriptUrl = 'https://script.google.com/macros/s/AKfycbx000ekmR8weYN6yqnVtF0epE0h93iV7P1_iU8MSuk1s8b7OSwpq6eZaqzOAm0IXQqI/exec';
                const defaultGeminiKey = 'AQ.Ab8RN6' + 'JwPEjMvaLfjQ54z1uldTge' + '-aqNjAc_m1-n0dyeeTTMVw';

                const [showSettings, setShowSettings] = useState(false);
                const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('gas_url') || defaultScriptUrl);
                const [geminiApiKey, setGeminiApiKey] = useState(() => localStorage.getItem('gemini_api_key') || defaultGeminiKey);
                const [isSyncing, setIsSyncing] = useState(false);
                
                useEffect(() => { localStorage.setItem('gas_url', gasUrl); }, [gasUrl]);
                useEffect(() => { localStorage.setItem('gemini_api_key', geminiApiKey); }, [geminiApiKey]);

                /* STREAMING_CHUNK:State các form thao tác */
                const [isAddingFood, setIsAddingFood] = useState(false);
                const [addingMeal, setAddingMeal] = useState('Sáng');
                const [entryMode, setEntryMode] = useState('quick'); 
                const [formData, setFormData] = useState({ name: '', kcal: '', carbs: '', fat: '', protein: '' });
                const [editingFoodId, setEditingFoodId] = useState(null);
                const [editFoodName, setEditFoodName] = useState('');
                
                const [imagePreview, setImagePreview] = useState(null);
                const [imageBase64, setImageBase64] = useState(null);
                const [foodDescription, setFoodDescription] = useState('');
                const [isScanning, setIsScanning] = useState(false);

                useEffect(() => { if (!isAddingFood) { setImagePreview(null); setImageBase64(null); setFoodDescription(''); } }, [isAddingFood]);

                const [isAddingSleep, setIsAddingSleep] = useState(false);
                const [sleepFormData, setSleepFormData] = useState({ sleepTime: '', wakeTime: '' });

                const [isAddingWorkout, setIsAddingWorkout] = useState(false);
                const [workoutAddStep, setWorkoutAddStep] = useState(1);
                const [workoutType, setWorkoutType] = useState(''); 
                const [workoutNote, setWorkoutNote] = useState('');
                const [currentExercises, setCurrentExercises] = useState([{ id: '1', name: '', sets: [{ reps: '', weight: '', unit: 'KG' }] }]);
                const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

                const [isAddingStat, setIsAddingStat] = useState(false);
                const [statFormData, setStatFormData] = useState({ mood: 3, outing: 1, dop1: 0, dop2: 0, dop3: 0, dop4: 0, summary: '' });

                const [timerSeconds, setTimerSeconds] = useState(null);
                const timerRef = useRef(null);

                const startRestTimer = (seconds) => {
                    if (timerRef.current) clearInterval(timerRef.current);
                    setTimerSeconds(seconds);
                    timerRef.current = setInterval(() => {
                        setTimerSeconds((prev) => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                if (navigator.vibrate) navigator.vibrate([300, 100, 300]); 
                                return 0; 
                            }
                            return prev - 1;
                        });
                    }, 1000);
                };

                const stopRestTimer = () => {
                    if (timerRef.current) clearInterval(timerRef.current);
                    setTimerSeconds(null);
                };

                useEffect(() => { if (!isAddingWorkout) stopRestTimer(); }, [isAddingWorkout]);

                const dateKey = formatDate(selectedDate);
                const currentFoods = foodsByDate[dateKey] || [];
                const currentSleeps = sleepByDate[dateKey] || [];
                const currentWorkout = workoutsByDate[dateKey] || null;
                const currentStat = statsByDate[dateKey] || null;
                const currentCircadian = getCircadianWarning(currentSleeps);

                /* STREAMING_CHUNK:Các hàm Tính Toán Chung */
                const calculateTotals = (foods) => {
                    return foods.reduce((acc, food) => {
                        acc.carbs += Number(food.carbs) || 0;
                        acc.fat += Number(food.fat) || 0;
                        acc.protein += Number(food.protein) || 0;
                        acc.kcal += Number(food.kcal !== undefined ? food.kcal : (food.carbs*4 + food.protein*4 + food.fat*9));
                        return acc;
                    }, { carbs: 0, fat: 0, protein: 0, kcal: 0 });
                };
                const currentTotals = calculateTotals(currentFoods);
                const totalKcal = Math.round(currentTotals.kcal);

                const calculateSleepDuration = (sleep, wake) => {
                    if (!sleep || !wake) return 0;
                    const [sH, sM] = sleep.split(':').map(Number);
                    const [wH, wM] = wake.split(':').map(Number);
                    let sTotal = sH * 60 + sM;
                    let wTotal = wH * 60 + wM;
                    if (wTotal < sTotal) wTotal += 24 * 60; 
                    return wTotal - sTotal; 
                };
                const formatDuration = (mins) => { if (!mins) return '0h'; return `${Math.floor(mins/60)}h${mins%60>0?mins%60:''}`; };
                const currentTotalSleepMins = currentSleeps.reduce((acc, curr) => acc + curr.duration, 0);

                const findPreviousExerciseHistory = (exerciseName, currentDateKey) => {
                    if (!exerciseName?.trim() || !workoutsByDate) return null;
                    const cNum = parseDateToNumber(currentDateKey);
                    const pastDates = Object.keys(workoutsByDate).filter(key => parseDateToNumber(key) < cNum).sort((a, b) => parseDateToNumber(b) - parseDateToNumber(a));
                    const histories = [];
                    for (const d of pastDates) {
                        const wOut = workoutsByDate[d];
                        if (!wOut || !wOut.exercises) continue;
                        const ex = wOut.exercises.find(e => e?.name?.toLowerCase().trim() === exerciseName.toLowerCase().trim());
                        if (ex && (ex.rawText || (ex.sets && ex.sets.length > 0))) {
                            histories.push({ dateStr: d, sets: ex.sets || [], rawText: ex.rawText || '' });
                            if (histories.length >= 2) break;
                        }
                    }
                    return histories.length > 0 ? histories : null;
                };

                const handleImageUpload = (e) => {
                    const file = e.target.files[0];
                    if (file) { const reader = new FileReader(); reader.onloadend = () => { setImagePreview(reader.result); setImageBase64(reader.result); }; reader.readAsDataURL(file); }
                };

                /* STREAMING_CHUNK:Giao tiếp AI Gemini */
                const handleScanFood = async () => {
                    if (!geminiApiKey) { showToast('Vui lòng nhập API Key trong Cài đặt!', 'error'); return; }
                    if (!imageBase64 && !foodDescription) { showToast('Vui lòng chọn ảnh hoặc nhập mô tả!', 'error'); return; }
                    setIsScanning(true);
                    try {
                        let parts = [{ text: `Phân tích món ăn sau và ước lượng calo, protein (g), carbs (g), fat (g). Dựa vào hình ảnh (nếu có) và mô tả: "${foodDescription || 'Không có'}". BẮT BUỘC chỉ trả về 1 object JSON thuần túy với định dạng: {"name": "Tên món", "kcal": số, "protein": số, "carbs": số, "fat": số}` }];
                        if (imageBase64) {
                            parts.push({ inlineData: { mimeType: imageBase64.match(/[^:]\w+\/[\w-+\d.]+(?=;|,)/)[0], data: imageBase64.split(',')[1] } });
                        }
                        const payload = {
                            contents: [{ role: "user", parts: parts }],
                            systemInstruction: { parts: [{ text: "Phân tích ngầm tỷ lệ theo khối lượng. Tính: calo = protein*4 + carb*4 + fat*9." }] },
                            generationConfig: { responseMimeType: "application/json" }
                        };
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${geminiApiKey.trim()}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        if (!response.ok) throw new Error(`Lỗi kết nối API (${response.status})`);
                        const result = await response.json();
                        if (result.candidates && result.candidates.length > 0) {
                            const data = JSON.parse(result.candidates[0].content.parts[0].text);
                            setFormData({ name: data.name || foodDescription, kcal: Math.round(data.kcal)||0, protein: cleanNum(data.protein)||0, carbs: cleanNum(data.carbs)||0, fat: cleanNum(data.fat)||0 });
                            setEntryMode('detail'); showToast('✨ Quét thành công!', 'success');
                        } else throw new Error("Không có kết quả");
                    } catch (err) { showToast('❌ Lỗi AI: ' + err.message, 'error'); }
                    setIsScanning(false);
                };

                /* STREAMING_CHUNK:Đồng Bộ Google Sheets (Push/Pull) */
                const handleSyncPush = async () => {
                    if(!gasUrl) { showToast('Vui lòng nhập link Script!', 'error'); return; }
                    setIsSyncing(true);
                    try {
                        const allDates = Array.from(new Set([...Object.keys(foodsByDate), ...Object.keys(sleepByDate)]));
                        const syncDataPayload = allDates.map(dKey => {
                            const fDay = foodsByDate[dKey] || []; const sDay = sleepByDate[dKey] || [];
                            const dNum = parseDateToNumber(dKey);
                            const isNewEra = dNum >= 20260821; 
                            const tAll = calculateTotals(fDay);

                            const formatMeal = (mealName) => {
                                const mFoods = fDay.filter(f => f.meal === mealName);
                                if (mFoods.length === 0) return 'X';
                                if (isNewEra) {
                                    return mFoods.map(f => {
                                        const kcal = Math.round(f.kcal !== undefined ? f.kcal : (f.carbs*4 + f.protein*4 + f.fat*9));
                                        return `${f.name}: ${kcal} kcal | P: ${cleanNum(f.protein)}g | C: ${cleanNum(f.carbs)}g | F: ${cleanNum(f.fat)}g`;
                                    }).join('\n');
                                } else {
                                    let tKc = 0, tPro = 0;
                                    const names = mFoods.map(f => {
                                        tKc += Number(f.kcal !== undefined ? f.kcal : (f.carbs*4 + f.protein*4 + f.fat*9));
                                        tPro += Number(f.protein);
                                        return f.name;
                                    });
                                    return `${names.join(', ')}: ${Math.round(tKc)} kcal + ${Math.round(tPro)} g protein`;
                                }
                            };
                            let sleepStr = '';
                            if (sDay.length > 0) sleepStr = `${sDay[sDay.length - 1].sleepTime}-${sDay[sDay.length - 1].wakeTime}`;
                            return { 
                                date: dKey, 
                                sang: formatMeal('Sáng'), trua: formatMeal('Trưa'), chieu: formatMeal('Chiều'), ngoai_le: formatMeal('Ngoài lề'), 
                                ngu: sleepStr,
                                totalKcal: Math.round(tAll.kcal), totalPro: cleanNum(tAll.protein)
                            };
                        });

                        const finalPayload = syncDataPayload.filter(item => item.sang !== 'X' || item.trua !== 'X' || item.chieu !== 'X' || item.ngoai_le !== 'X' || item.ngu !== '');

                        const statsPayload = Object.keys(statsByDate).map(d => ({ date: d, ...statsByDate[d] }));

                        let formattedWorkouts = [];
                        Object.keys(workoutsByDate).forEach(wDate => {
                            const wOut = workoutsByDate[wDate];
                            if (wOut && ["Upper", "Lower", "Push", "Pull", "Leg"].includes(wOut.type)) {
                                const exes = (wOut.exercises || []).map(ex => {
                                    if (ex.rawText && ex.rawText.trim() !== '') return { name: ex.name, sets: [{ reps: ex.rawText.trim(), weight: '', unit: '' }] };
                                    
                                    const vSets = (ex.sets || []).filter(s => s.weight.trim() !== '' || s.reps.trim() !== '');
                                    if (vSets.length === 0) return { name: ex.name, sets: [] };
                                    let allSame = true;
                                    const fW = vSets[0].weight.trim(), fU = vSets[0].unit.toUpperCase();
                                    for(let i=1; i<vSets.length; i++) { if(vSets[i].weight.trim()!==fW || vSets[i].unit.toUpperCase()!==fU) { allSame = false; break; } }
                                    if (allSame) return { name: ex.name, sets: vSets.map(s => ({ reps: s.reps, weight: s.weight, unit: s.unit.toUpperCase() })) };
                                    return { name: ex.name, sets: [{ reps: vSets.map(s => `${s.reps||'0'}(${s.weight?s.weight+s.unit.toUpperCase():''})`).join('+'), weight: '', unit: '' }] };
                                });
                                formattedWorkouts.push({ type: wOut.type, date: wDate, note: wOut.note, exercises: exes });
                            }
                        });
                        
                        formattedWorkouts.sort((a,b) => parseDateToNumber(a.date) - parseDateToNumber(b.date));

                        const response = await fetch(gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                            body: JSON.stringify({ data: finalPayload, workoutsData: formattedWorkouts, statsData: statsPayload }) 
                        });
                        const res = await response.json();
                        if(res.status === 'success') showToast(`✅ Đã Upload! Ăn/Ngủ: +${res.macroAdded} | ↺${res.macroUpdated}. Tập luyện: ↺${res.workoutProcessed}. (Bảo vệ ${res.blockedOldData} ngày cũ)`, 'success');
                        else showToast('❌ Lỗi: ' + res.error, 'error');
                    } catch (e) { showToast('❌ Lỗi: ' + e.message, 'error'); }
                    setIsSyncing(false);
                };

                const handleSyncPull = async (autoUrl = null) => {
                    const targetUrl = typeof autoUrl === 'string' ? autoUrl : gasUrl;
                    if(!targetUrl) return; 
                    setIsSyncing(true);

                    const parseRawDate = (raw) => {
                        if (!raw) return null;
                        let s = String(raw).trim();
                        let p = s.split('/');
                        if (p.length === 3) return `${p[0].padStart(2,'0')}/${p[1].padStart(2,'0')}/${p[2]}`;
                        p = s.split('-');
                        if (p.length === 3) {
                            if (p[0].length === 4) return `${p[2].substring(0,2).padStart(2,'0')}/${p[1].padStart(2,'0')}/${p[0]}`;
                            return `${p[0].padStart(2,'0')}/${p[1].padStart(2,'0')}/${p[2]}`;
                        }
                        return s;
                    };

                    try {
                        const response = await fetch(targetUrl);
                        const data = await response.json();
                        if (data.status === 'success' && data.data) {
                            
                            // Lịch tập
                            if (data.data.workouts) {
                                setWorkoutsByDate(prev => {
                                    let nW = { ...prev };
                                    Object.keys(data.data.workouts).forEach(wType => {
                                        const sheetData = data.data.workouts[wType];
                                        let cHead = [];
                                        for (let i = 0; i < sheetData.length; i++) {
                                            const row = sheetData[i]; if (!row[0]) continue;
                                            if (String(row[0]).toLowerCase().trim() === 'date') { cHead = row; continue; }
                                            if (cHead.length > 1) {
                                                const dClean = parseRawDate(row[0]); if(!dClean) continue;
                                                let exes = []; let note = '';
                                                for (let c = 1; c < cHead.length; c++) {
                                                    const hName = cHead[c].trim();
                                                    if (!hName || hName.toLowerCase() === 'note' || hName.toLowerCase() === 'ghi chú') { if (hName) note = row[c] || ''; continue; }
                                                    const cell = String(row[c] || '').trim();
                                                    if (cell && cell.toUpperCase() !== 'X') exes.push({ id: Date.now()+c, name: hName, rawText: cell, sets: [{ reps:'', weight:'', unit:'KG' }] });
                                                    else exes.push({ id: Date.now()+c, name: hName, sets: [{ reps:'', weight:'', unit:'KG' }] });
                                                }
                                                nW[dClean] = { type: wType, note: note, exercises: exes };
                                            }
                                        }
                                    });
                                    return nW;
                                });
                            }

                            const parseMealString = (mealName, mealString) => {
                                if (!mealString || mealString === 'X' || mealString.trim() === '') return [];
                                const items = mealString.split('\n'); let res = [];
                                items.forEach(item => {
                                    if(item.trim() === '') return;
                                    const mNew = item.match(/^(.*?):\s*(\d+(?:\.\d+)?)\s*kcal\s*\|\s*P:\s*(\d+(?:\.\d+)?)\s*g\s*\|\s*C:\s*(\d+(?:\.\d+)?)\s*g\s*\|\s*F:\s*(\d+(?:\.\d+)?)\s*g/i);
                                    const mOld = item.match(/^(.*?):\s*(\d+(?:\.\d+)?)\s*kcal\s*\+\s*(\d+(?:\.\d+)?)\s*g/i);
                                    
                                    if (mNew) res.push({ id: Math.random().toString(), name: mNew[1].trim(), meal: mealName, kcal: Number(mNew[2]), protein: Number(mNew[3]), carbs: Number(mNew[4]), fat: Number(mNew[5]) });
                                    else if (mOld) res.push({ id: Math.random().toString(), name: mOld[1].trim(), meal: mealName, kcal: Number(mOld[2]), protein: Number(mOld[3]), carbs: 0, fat: 0 });
                                    else res.push({ id: Math.random().toString(), name: item.trim(), meal: mealName, kcal: 0, protein: 0, carbs: 0, fat: 0 });
                                });
                                return res;
                            };

                            const parseSleepString = (s) => {
                                if (!s || s === 'X') return [];
                                const p = s.split('-');
                                if (p.length === 2) return [{ id: Math.random().toString(), sleepTime: p[0].trim(), wakeTime: p[1].trim(), duration: calculateSleepDuration(p[0].trim(), p[1].trim()) }];
                                return [];
                            };

                            const processTracking = (dtArray) => {
                                let f = {}, s = {};
                                for (let i = 0; i < dtArray.length; i++) {
                                    const r = dtArray[i]; if (!r[0] || String(r[0]).toLowerCase() === 'date') continue;
                                    const dClean = parseRawDate(r[0]); if(!dClean) continue;
                                    
                                    let dFoods = [].concat(parseMealString('Sáng', r[1]), parseMealString('Trưa', r[2]), parseMealString('Chiều', r[3]), parseMealString('Ngoài lề', r[4]));
                                    if (dFoods.length > 0) f[dClean] = dFoods;
                                    let dSleeps = parseSleepString(r[8]);
                                    if (dSleeps.length > 0) s[dClean] = dSleeps;
                                }
                                return {f, s};
                            };

                            if (data.data.dailyTracking || data.data.dailyTrackin) {
                                const oldData = data.data.dailyTracking ? processTracking(data.data.dailyTracking) : {f:{}, s:{}};
                                const newData = data.data.dailyTrackin ? processTracking(data.data.dailyTrackin) : {f:{}, s:{}};
                                setFoodsByDate({ ...oldData.f, ...newData.f });
                                setSleepByDate({ ...oldData.s, ...newData.s });
                            }

                            if (data.data.stat) {
                                setStatsByDate(prev => {
                                   let nS = { ...prev };
                                   for (let i = 0; i < data.data.stat.length; i++) {
                                       const r = data.data.stat[i]; if (!r[0] || String(r[0]).toLowerCase() === 'date') continue;
                                       const dClean = parseRawDate(r[0]); if(!dClean) continue;
                                       nS[dClean] = { mood: Number(r[1])||3, outing: Number(r[2])||1, dop1: Number(r[3])||0, dop2: Number(r[4])||0, dop3: Number(r[5])||0, dop4: Number(r[6])||0, dopTotal: Number(r[7])||0, summary: String(r[8]||'') };
                                   }
                                   return nS;
                                });
                            }
                            if (typeof autoUrl !== 'string') showToast('☁️ Kéo dữ liệu Máy chủ thành công!', 'success');
                        }
                    } catch (e) { if (typeof autoUrl !== 'string') showToast('❌ Lỗi kết nối', 'error'); }
                    setIsSyncing(false);
                };

                useEffect(() => { const gUrl = localStorage.getItem('gas_url') || defaultScriptUrl; if (gUrl) handleSyncPull(gUrl); }, []);

                /* STREAMING_CHUNK:Event Handlers Thêm/Xóa/Sửa */
                const handleAddFood = (e) => {
                    e.preventDefault(); if (!formData.name) return;
                    if (entryMode === 'quick' && (Number(formData.kcal)||0)/4 < (Number(formData.protein)||0)) { showToast('⚠️ Kcal chia 4 không thể nhỏ hơn lượng Protein!', 'error'); return; }
                    const nF = { id: Date.now().toString(), name: formData.name, meal: addingMeal, protein: cleanNum(formData.protein)||0 };
                    if (entryMode === 'quick') { nF.kcal = Math.round(formData.kcal)||0; nF.carbs = 0; nF.fat = 0; } 
                    else { nF.carbs = cleanNum(formData.carbs)||0; nF.fat = cleanNum(formData.fat)||0; nF.kcal = Math.round((nF.carbs*4)+(nF.protein*4)+(nF.fat*9)); }
                    setFoodsByDate(p => ({ ...p, [dateKey]: [...(p[dateKey] || []), nF] }));
                    setFormData({ name: '', kcal: '', carbs: '', fat: '', protein: '' }); setIsAddingFood(false);
                };
                const handleDeleteFood = (id) => setFoodsByDate(p => ({ ...p, [dateKey]: (p[dateKey] || []).filter(f => f.id !== id) }));
                const handleSaveEditFood = (id) => { if (!editFoodName.trim()) { setEditingFoodId(null); return; } setFoodsByDate(p => ({ ...p, [dateKey]: (p[dateKey] || []).map(f => f.id === id ? { ...f, name: editFoodName } : f) })); setEditingFoodId(null); setEditFoodName(''); };

                const handleAddSleep = (e) => {
                    e.preventDefault(); if (!sleepFormData.sleepTime || !sleepFormData.wakeTime) return;
                    setSleepByDate(p => ({ ...p, [dateKey]: [...(p[dateKey] || []), { id: Date.now().toString(), sleepTime: sleepFormData.sleepTime, wakeTime: sleepFormData.wakeTime, duration: calculateSleepDuration(sleepFormData.sleepTime, sleepFormData.wakeTime) }] }));
                    setSleepFormData({ sleepTime: '', wakeTime: '' }); setIsAddingSleep(false);
                };
                const handleDeleteSleep = (id) => setSleepByDate(p => ({ ...p, [dateKey]: (p[dateKey] || []).filter(s => s.id !== id) }));

                const handleStartWorkout = (t) => { 
                    setWorkoutType(t); setWorkoutAddStep(2); 
                    const pD = Object.keys(workoutsByDate).sort((a,b)=>parseDateToNumber(b)-parseDateToNumber(a)); 
                    let tE = []; 
                    for(let d of pD) { 
                        const wOut = workoutsByDate[d];
                        if(wOut?.type === t && wOut?.exercises) { 
                            tE = wOut.exercises.map((ex, i) => ({ id: Date.now()+i, name: ex.name || '', sets: [{ reps: '', weight: '', unit: 'KG' }] })); 
                            break; 
                        } 
                    } 
                    if (tE.length > 0) setCurrentExercises(tE); else setCurrentExercises([{ id: '1', name: '', sets: [{ reps: '', weight: '', unit: 'KG' }] }]); 
                };
                const handleSaveWorkout = () => { const vEx = currentExercises.filter(ex => ex.name.trim() !== ''); if (vEx.length === 0) return; setWorkoutsByDate(p => ({ ...p, [dateKey]: { type: workoutType, note: workoutNote, exercises: vEx } })); setIsAddingWorkout(false); setWorkoutAddStep(1); };
                const handleDeleteWorkout = () => { setWorkoutsByDate(p => { const n = {...p}; delete n[dateKey]; return n; }); setShowDeleteConfirm(false); };
                const handleAddExerciseRow = () => setCurrentExercises(prev => [...prev, { id: Date.now().toString(), name: '', sets: [{ reps: '', weight: '', unit: 'KG' }] }]);
                const handleUpdateExerciseName = (id, name) => setCurrentExercises(prev => prev.map(ex => ex.id === id ? { ...ex, name } : ex));
                const handleAddSet = (exId) => setCurrentExercises(prev => prev.map(ex => { if (exId === ex.id) { const ls = ex.sets[ex.sets.length - 1] || { reps: '', weight: '', unit: 'KG' }; return { ...ex, sets: [...ex.sets, { ...ls }] }; } return ex; }));
                const handleUpdateSet = (exId, sIdx, field, val) => setCurrentExercises(p => p.map(ex => { if (ex.id === exId) { const ns = [...ex.sets]; ns[sIdx] = { ...ns[sIdx], [field]: val }; return { ...ex, sets: ns }; } return ex; }));
                const handleToggleUnit = (exId, sIdx) => setCurrentExercises(p => p.map(ex => { if (ex.id === exId) { const ns = [...ex.sets]; ns[sIdx] = { ...ns[sIdx], unit: ns[sIdx].unit.toLowerCase() === 'kg' ? 'LBS' : 'KG' }; return { ...ex, sets: ns }; } return ex; }));
                const handleRemoveSet = (exId, sIdx) => setCurrentExercises(prev => prev.map(ex => ex.id === exId ? { ...ex, sets: ex.sets.filter((_, i) => i !== sIdx) } : ex));

                const handleSaveStat = () => {
                    const dopTotal = (statFormData.dop1 * 2.5) + (statFormData.dop2 * 2.0) + (statFormData.dop3 * 1.5) + (statFormData.dop4 * 1.0);
                    setStatsByDate(p => ({ ...p, [dateKey]: { ...statFormData, dopTotal } }));
                    setIsAddingStat(false); showToast('📓 Đã ghi nhận nhật ký!', 'success');
                };

                const changeDate = (o) => { const n = new Date(selectedDate); n.setDate(n.getDate() + o); setSelectedDate(n); };
                const changeWeek = (o) => { const n = new Date(currentWeekStart); n.setDate(n.getDate() + (o * 7)); setCurrentWeekStart(n); };
                const changeMonth = (o) => { const n = new Date(currentMonthStart); n.setMonth(n.getMonth() + o); setCurrentMonthStart(n); };

                const weekDays = [...Array(7)].map((_, i) => { const d = new Date(currentWeekStart); d.setDate(d.getDate() + i); return d; });
                const monthDays = [...Array(getDaysInMonth(currentMonthStart.getFullYear(), currentMonthStart.getMonth()))].map((_, i) => new Date(currentMonthStart.getFullYear(), currentMonthStart.getMonth(), i + 1));
                const firstDayOfMonth = new Date(currentMonthStart.getFullYear(), currentMonthStart.getMonth(), 1).getDay();

                /* STREAMING_CHUNK:Thống Kê Khối Lượng */
                let weekThieuDam = 0, weekCheatDay = 0, weekLateSleep = 0, weekLateWake = 0, weekWorkout = 0;
                weekDays.forEach(day => {
                    const dKey = formatDate(day); const fDay = foodsByDate[dKey] || [];
                    if (fDay.length > 0) { const tots = calculateTotals(fDay); if (tots.protein < 115) weekThieuDam++; if (Math.round(tots.kcal) > 2500) weekCheatDay++; }
                    const sDay = sleepByDate[dKey] || [];
                    if (sDay.length > 0) { const cWarn = getCircadianWarning(sDay); if (cWarn === 'late_sleep' || cWarn === 'bomb') weekLateSleep++; if (cWarn === 'late_wake' || cWarn === 'bomb') weekLateWake++; }
                    if (workoutsByDate[dKey]) weekWorkout++;
                });

                let monthThieuDam = 0, monthCheatDay = 0, monthLateSleep = 0, monthLateWake = 0, monthWorkout = 0, monthSleepDaysCount = 0;
                monthDays.forEach(day => {
                    const dKey = formatDate(day); const fDay = foodsByDate[dKey] || [];
                    if (fDay.length > 0) { const tots = calculateTotals(fDay); if (tots.protein < 115) monthThieuDam++; if (Math.round(tots.kcal) > 2500) monthCheatDay++; }
                    const sDay = sleepByDate[dKey] || [];
                    if (sDay.length > 0) { monthSleepDaysCount++; const cWarn = getCircadianWarning(sDay); if (cWarn === 'late_sleep' || cWarn === 'bomb') monthLateSleep++; if (cWarn === 'late_wake' || cWarn === 'bomb') monthLateWake++; }
                    if (workoutsByDate[dKey]) monthWorkout++;
                });

                const todayObj = new Date(); const todayOnlyDate = new Date(todayObj.getFullYear(), todayObj.getMonth(), todayObj.getDate());
                const monthViewStart = new Date(currentMonthStart.getFullYear(), currentMonthStart.getMonth(), 1);
                let elapsedDays = 0;
                if (monthViewStart.getFullYear() === todayOnlyDate.getFullYear() && monthViewStart.getMonth() === todayOnlyDate.getMonth()) elapsedDays = todayOnlyDate.getDate();
                else if (monthViewStart < todayOnlyDate) elapsedDays = getDaysInMonth(monthViewStart.getFullYear(), monthViewStart.getMonth());
                
                const pctLateSleep = Math.round((monthLateSleep / (monthSleepDaysCount||1)) * 100) || 0;
                const pctLateWake = Math.round((monthLateWake / (monthSleepDaysCount||1)) * 100) || 0;
                const pctThieuDam = Math.round((monthThieuDam / (elapsedDays||1)) * 100) || 0;
                const pctCheatDay = Math.round((monthCheatDay / (elapsedDays||1)) * 100) || 0;
                const pctWorkout = Math.round((monthWorkout / (elapsedDays||1)) * 100) || 0;

                /* STREAMING_CHUNK:Khung Layout Chính & DARK MODE Container */
                return (
                    <div className={isDarkMode ? "dark" : ""}>
                    <div className="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans pb-24 selection:bg-emerald-200 transition-colors duration-300">
                        {toast && (
                            <div className="fixed top-4 left-1/2 z-[200] w-max max-w-[90vw] animate-[toastSlide_0.3s_ease-out] flex justify-center" style={{ transform: 'translateX(-50%)' }}>
                                <div className={`px-6 py-4 rounded-2xl shadow-xl border font-bold text-sm flex items-center gap-3 ${toast.type === 'error' ? 'bg-red-50 dark:bg-red-900/50 text-red-600 dark:text-red-400 border-red-200 dark:border-red-800' : 'bg-slate-800 dark:bg-slate-800 text-white border-slate-700 dark:border-slate-700'}`}>
                                    {toast.type === 'error' ? <XIcon size={20}/> : <CheckCircleIcon size={20} className="text-emerald-400"/>}
                                    {toast.msg}
                                </div>
                            </div>
                        )}

                        <header className="bg-white dark:bg-slate-900 px-4 py-4 rounded-b-3xl shadow-sm border-b border-slate-100 dark:border-slate-800 sticky top-0 z-40 flex flex-col items-center transition-colors">
                            <div className="flex justify-between items-center w-full max-w-md mb-3 px-2">
                                <h1 className="text-slate-800 dark:text-slate-100 font-black text-xl tracking-wide flex items-center gap-2">Calasu Tracker</h1>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => setIsDarkMode(!isDarkMode)} className="text-slate-400 dark:text-slate-500 p-2 rounded-full hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                                        {isDarkMode ? <SunIcon size={20}/> : <MoonIcon size={20}/>}
                                    </button>
                                    <button onClick={() => setShowSettings(true)} className="text-blue-500 p-2 rounded-full bg-blue-50 dark:bg-blue-900/20 hover:bg-blue-100 dark:hover:bg-blue-900/40 transition-colors shadow-sm"><CloudIcon size={20} /></button>
                                </div>
                            </div>
                            <div className="flex w-full max-w-md gap-1.5 mb-4 bg-slate-100 dark:bg-slate-800 p-1.5 rounded-2xl overflow-x-auto no-scrollbar snap-x transition-colors">
                                <button onClick={() => setAppMode('stat')} className={`snap-center shrink-0 w-[85px] flex flex-col items-center justify-center gap-1 py-2 rounded-xl font-bold transition-all text-[11px] ${appMode === 'stat' ? 'bg-white dark:bg-slate-900 text-purple-600 dark:text-purple-400 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}><BookIcon size={18}/> Nhật ký</button>
                                <button onClick={() => setAppMode('macro')} className={`snap-center shrink-0 w-[85px] flex flex-col items-center justify-center gap-1 py-2 rounded-xl font-bold transition-all text-[11px] ${appMode === 'macro' ? 'bg-white dark:bg-slate-900 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}><UtensilsIcon size={18}/> Eating</button>
                                <button onClick={() => setAppMode('sleep')} className={`snap-center shrink-0 w-[85px] flex flex-col items-center justify-center gap-1 py-2 rounded-xl font-bold transition-all text-[11px] ${appMode === 'sleep' ? 'bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}><MoonIcon size={18}/> Sleeping</button>
                                <button onClick={() => setAppMode('workout')} className={`snap-center shrink-0 w-[85px] flex flex-col items-center justify-center gap-1 py-2 rounded-xl font-bold transition-all text-[11px] ${appMode === 'workout' ? 'bg-white dark:bg-slate-900 text-orange-600 dark:text-orange-400 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}><DumbbellIcon size={18}/> Work Out</button>
                            </div>
                            <div className="flex bg-slate-50 dark:bg-slate-900 p-1 rounded-xl w-full max-w-md border border-slate-100 dark:border-slate-800 transition-colors">
                                {['day', 'week', 'month'].map(view => {
                                    let aCls = ''; 
                                    if (appMode === 'macro') aCls = 'bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400'; 
                                    else if (appMode === 'sleep') aCls = 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-400';

                                                </div>
                                                <div className="space-y-1.5">
                                                    {foodsByDate[dayDetailModal].map((f,i) => <p key={i} className="text-[11px] text-slate-600 dark:text-slate-400 flex justify-between"><span>• {f.name}</span><span className="font-bold">{f.kcal||Math.round(f.carbs*4+f.protein*4+f.fat*9)}k - {cleanNum(f.protein)}p</span></p>)}
                                                </div>
                                            </div>
                                        ) : null}

                                        {/* Ngủ */}
                                        {sleepByDate[dayDetailModal] && sleepByDate[dayDetailModal].length > 0 ? (
                                            <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm transition-colors">
                                                <h4 className="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1"><MoonIcon size={14}/> Giấc ngủ</h4>
                                                {sleepByDate[dayDetailModal].map((s,i) => (
                                                    <p key={i} className="text-sm font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/20 p-2 rounded-xl inline-block mr-2 transition-colors">{s.sleepTime} - {s.wakeTime} <span className="text-slate-400 dark:text-slate-500 text-[11px] ml-1">({formatDuration(s.duration)})</span></p>
                                                ))}
                                            </div>
                                        ) : null}

                                        {/* Tập luyện */}
                                        {workoutsByDate[dayDetailModal] ? (
                                            <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm transition-colors">
                                                <h4 className="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1"><DumbbellIcon size={14}/> Bài tập ({workoutsByDate[dayDetailModal].type})</h4>
                                                <div className="space-y-2">
                                                    {workoutsByDate[dayDetailModal].exercises?.map((ex, i) => (
                                                        <div key={i} className="text-[11px]">
                                                            <p className="font-bold text-slate-700 dark:text-slate-200">{ex.name}</p>
                                                            {ex.rawText && ex.rawText.toUpperCase() !== 'X' ? (
                                                                <p className="text-slate-500 dark:text-slate-400 mt-0.5">{ex.rawText}</p>
                                                            ) : (
                                                                <p className="text-slate-500 dark:text-slate-400 mt-0.5">{ex.sets?.map(s=>`${s.weight}${s.unit}x${s.reps}`).join(', ')}</p>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ) : null}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Modal Xóa Buổi Tập */}
                        {showDeleteConfirm && (
                            <div className="fixed inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-sm z-[100] flex justify-center items-center p-4">
                                <div className="bg-white dark:bg-slate-900 w-full max-w-sm rounded-3xl shadow-2xl p-6 text-center transition-colors">
                                    <div className="w-16 h-16 bg-red-100 dark:bg-red-900/30 text-red-500 dark:text-red-400 rounded-full flex items-center justify-center mx-auto mb-4"><Trash2Icon size={32} /></div>
                                    <h3 className="text-xl font-black text-slate-800 dark:text-slate-100 mb-2">Xóa buổi tập?</h3>
                                    <p className="text-slate-500 dark:text-slate-400 text-sm mb-6">Bạn có chắc chắn muốn xóa toàn bộ dữ liệu của buổi tập này không?</p>
                                    <div className="flex gap-3">
                                        <button onClick={() => setShowDeleteConfirm(false)} className="flex-1 py-3.5 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl font-bold transition-colors">Hủy</button>
                                        <button onClick={handleDeleteWorkout} className="flex-1 py-3.5 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold shadow-lg transition-colors">Xóa ngay</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Modal Cài Đặt Đồng Bộ */}
                        {showSettings && (
                            <div className="fixed inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-sm z-[100] flex justify-center items-center p-4">
                                <div className="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[2rem] shadow-2xl p-6 transition-colors">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-xl font-black text-slate-800 dark:text-slate-100 flex items-center gap-2"><CloudIcon className="text-blue-500 dark:text-blue-400" /> Đồng bộ Dữ liệu</h2>
                                        <button onClick={() => setShowSettings(false)} className="text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-800 p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"><XIcon size={20} /></button>
                                    </div>
                                    <div className="space-y-5">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-2">Link Apps Script (Web App URL)</label>
                                            <input type="text" value={gasUrl} onChange={(e) => setGasUrl(e.target.value)} placeholder="https://script.google.com/macros/s/..." className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-blue-500 dark:focus:border-blue-500 text-sm font-medium text-slate-700 dark:text-slate-200 transition-colors" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-2 flex items-center gap-1.5"><SparklesIcon size={14} className="text-emerald-500 dark:text-emerald-400"/> Gemini API Key</label>
                                            <input type="text" value={geminiApiKey} onChange={(e) => setGeminiApiKey(e.target.value)} placeholder="Nhập API Key để dùng AI..." className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-emerald-500 dark:focus:border-emerald-500 text-sm font-medium text-slate-700 dark:text-slate-200 transition-colors" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button onClick={handleSyncPush} disabled={isSyncing} className="py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-bold flex flex-col items-center justify-center gap-1 disabled:opacity-50 transition-colors"><UploadIcon size={20} /> <span className="text-xs">Đẩy lên Sheet</span></button>
                                            <button onClick={() => handleSyncPull()} disabled={isSyncing} className="py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold flex flex-col items-center justify-center gap-1 disabled:opacity-50 transition-colors"><DownloadIcon size={20} /> <span className="text-xs">Tải từ Sheet</span></button>
                                        </div>
                                        {isSyncing && <p className="text-center text-blue-500 dark:text-blue-400 text-sm font-bold flex items-center justify-center gap-2"><LoaderIcon className="animate-spin" size={16} /> Đang xử lý...</p>}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
            
        } catch (error) {
            console.error(error);
        }
    </script>
</body>
</html>
