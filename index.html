<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Macro & Workout Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide-react@0.292.0/dist/umd/lucide-react.js"></script>

    <style>
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastSlide { from { transform: translateX(-50%) translateY(100px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
        @keyframes flashRed { 0%, 100% { background-color: #fee2e2; color: #ef4444; } 50% { background-color: #ef4444; color: white; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="time"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; transition: 0.2s; }
        input[type="time"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        body { -webkit-tap-highlight-color: transparent; }
        .timer-done { animation: flashRed 1s infinite; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24 selection:bg-emerald-200">
    <div id="root"></div>

    <script type="text/babel">
        try {
            {}
            let IconLib = window.lucideReact;
            
            if (!IconLib) {
                const E = (char) => ({ size, className }) => <span className={className} style={{ fontSize: size ? size * 0.8 : 'inherit', lineHeight: 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>{char}</span>;
                IconLib = {
                    Calendar: E("📅"), Plus: E("➕"), Trash2: E("🗑️"), Camera: E("📷"), Sparkles: E("✨"),
                    Wheat: E("🌾"), Beef: E("🥩"), Pencil: E("✏️"), Sunrise: E("🌅"), Sunset: E("🌇"),
                    Coffee: E("☕"), Dumbbell: E("🏋️"), X: E("❌"), ChevronLeft: E("◀️"), ChevronRight: E("▶️"),
                    Utensils: E("🍽️"), Moon: E("🌙"), Flame: E("🔥"), Droplet: E("💧"), Sun: E("☀️"),
                    Clock: E("🕒"), CheckCircle: E("✅"), Loader: E("⏳"), Activity: E("📈"), Image: E("🖼️"),
                    Cloud: E("☁️"), Download: E("⬇️"), Upload: E("⬆️"), Skull: E("💀"), Bomb: E("💣"), Heart: E("💚"), AlertTriangle: E("❗"), XCircle: E("❌"),
                    Timer: E("⏱️")
                };
            }

            const {
                Calendar: CalendarIcon, Plus: PlusIcon, Trash2: Trash2Icon, Camera: CameraIcon, Sparkles: SparklesIcon,
                Wheat: WheatIcon, Beef: BeefIcon, Pencil: PencilIcon,
                Sunrise: SunriseIcon, Sunset: SunsetIcon, Coffee: CoffeeIcon,
                Dumbbell: DumbbellIcon, X: XIcon, ChevronLeft: ChevronLeftIcon, ChevronRight: ChevronRightIcon,
                Utensils: UtensilsIcon, Moon: MoonIcon, Flame: FlameIcon, Droplet: DropletIcon, Sun: SunIcon,
                Clock: ClockIcon, CheckCircle: CheckCircleIcon, Loader: LoaderIcon, Activity: ActivityIcon, Image: ImageIcon,
                Cloud: CloudIcon, Download: DownloadIcon, Upload: UploadIcon, Skull: SkullIcon, Bomb: BombIcon, Heart: HeartIcon, AlertTriangle: AlertIcon, XCircle: XCircleIcon,
                Timer: TimerIcon
            } = IconLib;

            const { useState, useEffect, useRef } = React;
            
            {}
            const VN_DAYS = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
            
            const formatDate = (date) => {
                const d = String(date.getDate()).padStart(2, '0');
                const m = String(date.getMonth() + 1).padStart(2, '0');
                return `${d}/${m}/${date.getFullYear()}`;
            };
            const getStartOfWeek = (date) => {
                const d = new Date(date);
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
                return new Date(d.setDate(diff));
            };
            const getStartOfMonth = (date) => new Date(date.getFullYear(), date.getMonth(), 1);
            const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();

            const getMacroStatus = (kcal, pro) => {
                if (!kcal && !pro) return null;
                let pScore = pro >= 115 ? 3 : (pro >= 90 ? 2 : 1);
                let cScore = kcal <= 2100 ? 3 : (kcal <= 2500 ? 2 : 1);
                let total = pScore + cScore;
                
                if (total === 6) return { bg: 'bg-emerald-500', border: 'border-emerald-600', text: 'text-white', dot: 'bg-emerald-500' };
                if (total >= 4) return { bg: 'bg-yellow-400', border: 'border-yellow-500', text: 'text-slate-800', dot: 'bg-yellow-400' };
                if (total === 3) return { bg: 'bg-red-500', border: 'border-red-600', text: 'text-white', dot: 'bg-red-500' };
                return { bg: 'bg-slate-800', border: 'border-slate-900', text: 'text-white', dot: 'bg-slate-800' };
            };

            const getSleepStatus = (mins) => {
                if (!mins || mins === 0) return null;
                if (mins >= 450) return { bg: 'bg-emerald-500', border: 'border-emerald-600', text: 'text-white', dot: 'bg-emerald-500' };
                if (mins >= 360) return { bg: 'bg-yellow-400', border: 'border-yellow-500', text: 'text-slate-800', dot: 'bg-yellow-400' };
                return { bg: 'bg-red-500', border: 'border-red-600', text: 'text-white', dot: 'bg-red-500' };
            };

            const getWorkoutColor = (type) => {
                switch(type) {
                    case 'Upper': return { text: 'text-orange-600', bg: 'bg-orange-50', border: 'border-orange-500', icon: 'text-orange-500', fill: 'bg-orange-500', textLight: 'text-white' };
                    case 'Lower': return { text: 'text-yellow-600', bg: 'bg-yellow-50', border: 'border-yellow-500', icon: 'text-yellow-500', fill: 'bg-yellow-400', textLight: 'text-slate-800' };
                    case 'Push': return { text: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-500', icon: 'text-emerald-500', fill: 'bg-emerald-500', textLight: 'text-white' };
                    case 'Pull': return { text: 'text-blue-600', bg: 'bg-blue-50', border: 'border-blue-500', icon: 'text-blue-500', fill: 'bg-blue-500', textLight: 'text-white' };
                    case 'Leg': return { text: 'text-purple-600', bg: 'bg-purple-50', border: 'border-purple-500', icon: 'text-purple-500', fill: 'bg-purple-500', textLight: 'text-white' };
                    default: return { text: 'text-slate-600', bg: 'bg-slate-50', border: 'border-slate-500', icon: 'text-slate-500', fill: 'bg-slate-500', textLight: 'text-white' };
                }
            };

            const getCircadianWarning = (sleeps) => {
                if (!sleeps || sleeps.length === 0) return null;
                const mainSleep = sleeps[sleeps.length - 1];
                if (!mainSleep.sleepTime || !mainSleep.wakeTime) return null;

                const [sH, sM] = mainSleep.sleepTime.split(':').map(Number);
                const [wH, wM] = mainSleep.wakeTime.split(':').map(Number);

                let isLateSleep = false;
                if (sH >= 0 && sH <= 5) {
                    if (sH === 0 && sM === 0) isLateSleep = false; 
                    else isLateSleep = true;
                }
                const isLateWake = (wH > 7) || (wH === 7 && wM > 0);

                if (isLateSleep && isLateWake) return 'bomb';
                if (isLateSleep) return 'late_sleep';
                if (isLateWake) return 'late_wake';
                return 'heart';
            };

            const renderCircadianIcon = (type, size = 14) => {
                const baseClass = "bg-white backdrop-blur-sm rounded-full p-0.5 shadow-sm inline-flex items-center justify-center border border-slate-200 z-20";
                if (type === 'bomb') return <div className={baseClass}><BombIcon size={size} className="text-slate-800" /></div>;
                if (type === 'late_sleep') return <div className={baseClass}><AlertIcon size={size} className="text-red-500" /></div>;
                if (type === 'late_wake') return <div className={baseClass}><XCircleIcon size={size} className="text-red-500" /></div>;
                if (type === 'heart') return <div className={baseClass}><HeartIcon size={size} className="text-emerald-500" /></div>;
                return null;
            };

            {}
            const App = () => {
                const [appMode, setAppMode] = useState('macro'); 
                const [currentView, setCurrentView] = useState('day'); 
                const [selectedDate, setSelectedDate] = useState(new Date());
                const [currentWeekStart, setCurrentWeekStart] = useState(getStartOfWeek(new Date()));
                const [currentMonthStart, setCurrentMonthStart] = useState(getStartOfMonth(new Date()));
                
                const loadSafeJSON = (key) => {
                    try { 
                        const item = localStorage.getItem(key); 
                        let obj = item && item !== "undefined" && item !== "null" ? JSON.parse(item) : {}; 
                        const newObj = {};
                        for(let k in obj) {
                            const parts = k.split('/');
                            if(parts.length === 3) {
                                const newK = `${parts[0].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[2]}`;
                                newObj[newK] = obj[k];
                            } else { newObj[k] = obj[k]; }
                        }
                        return newObj;
                    } catch (e) { return {}; }
                };

                const [foodsByDate, setFoodsByDate] = useState(() => loadSafeJSON('macro_foods'));
                const [sleepByDate, setSleepByDate] = useState(() => loadSafeJSON('macro_sleeps'));
                const [workoutsByDate, setWorkoutsByDate] = useState(() => loadSafeJSON('macro_workouts'));

                useEffect(() => { localStorage.setItem('macro_foods', JSON.stringify(foodsByDate)); }, [foodsByDate]);
                useEffect(() => { localStorage.setItem('macro_sleeps', JSON.stringify(sleepByDate)); }, [sleepByDate]);
                useEffect(() => { localStorage.setItem('macro_workouts', JSON.stringify(workoutsByDate)); }, [workoutsByDate]);

                const [toast, setToast] = useState(null);
                const showToast = (msg, type = 'success') => {
                    setToast({ msg, type });
                    setTimeout(() => setToast(null), 5000);
                };

                // LƯU CẢ GAS URL VÀ GEMINI API KEY VÀO LOCALSTORAGE
                const [showSettings, setShowSettings] = useState(false);
                const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('gas_url') || '');
                const [geminiApiKey, setGeminiApiKey] = useState(() => localStorage.getItem('gemini_api_key') || '');
                const [isSyncing, setIsSyncing] = useState(false);
                useEffect(() => { localStorage.setItem('gas_url', gasUrl); }, [gasUrl]);
                useEffect(() => { localStorage.setItem('gemini_api_key', geminiApiKey); }, [geminiApiKey]);

                const [isAddingFood, setIsAddingFood] = useState(false);
                const [addingMeal, setAddingMeal] = useState('Sáng');
                const [entryMode, setEntryMode] = useState('quick'); 
                const [formData, setFormData] = useState({ name: '', kcal: '', carbs: '', fat: '', protein: '' });
                const [editingFoodId, setEditingFoodId] = useState(null);
                const [editFoodName, setEditFoodName] = useState('');
                
                const [imagePreview, setImagePreview] = useState(null);
                const [imageBase64, setImageBase64] = useState(null);
                const [foodDescription, setFoodDescription] = useState('');
                const [isScanning, setIsScanning] = useState(false);

                useEffect(() => {
                    if (!isAddingFood) {
                        setImagePreview(null);
                        setImageBase64(null);
                        setFoodDescription('');
                    }
                }, [isAddingFood]);

                const [isAddingSleep, setIsAddingSleep] = useState(false);
                const [sleepFormData, setSleepFormData] = useState({ sleepTime: '', wakeTime: '' });

                const [isAddingWorkout, setIsAddingWorkout] = useState(false);
                const [workoutAddStep, setWorkoutAddStep] = useState(1);
                const [workoutType, setWorkoutType] = useState(''); 
                const [workoutNote, setWorkoutNote] = useState('');
                const [currentExercises, setCurrentExercises] = useState([{ id: '1', name: '', sets: [{ reps: '', weight: '', unit: 'KG' }] }]);
                const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

                const [timerSeconds, setTimerSeconds] = useState(null);
                const timerRef = useRef(null);

                const startRestTimer = (seconds) => {
                    if (timerRef.current) clearInterval(timerRef.current);
                    setTimerSeconds(seconds);
                    timerRef.current = setInterval(() => {
                        setTimerSeconds((prev) => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                if (navigator.vibrate) navigator.vibrate([300, 100, 300]); 
                                return 0; 
                            }
                            return prev - 1;
                        });
                    }, 1000);
                };

                const stopRestTimer = () => {
                    if (timerRef.current) clearInterval(timerRef.current);
                    setTimerSeconds(null);
                };

                useEffect(() => {
                    if (!isAddingWorkout) { stopRestTimer(); }
                }, [isAddingWorkout]);

                const dateKey = formatDate(selectedDate);
                const currentFoods = foodsByDate[dateKey] || [];
                const currentSleeps = sleepByDate[dateKey] || [];
                const currentWorkout = workoutsByDate[dateKey] || null;
                const currentCircadian = getCircadianWarning(currentSleeps);

                const calculateTotals = (foods) => {
                    return foods.reduce((acc, food) => {
                        acc.carbs += Number(food.carbs) || 0;
                        acc.fat += Number(food.fat) || 0;
                        acc.protein += Number(food.protein) || 0;
                        if (food.kcal !== undefined) {
                            acc.kcal += Number(food.kcal);
                        } else {
                            acc.kcal += (Number(food.carbs || 0) * 4) + (Number(food.protein || 0) * 4) + (Number(food.fat || 0) * 9);
                        }
                        return acc;
                    }, { carbs: 0, fat: 0, protein: 0, kcal: 0 });
                };
                const currentTotals = calculateTotals(currentFoods);
                const totalKcal = Math.round(currentTotals.kcal);

                const calculateSleepDuration = (sleep, wake) => {
                    if (!sleep || !wake) return 0;
                    const [sH, sM] = sleep.split(':').map(Number);
                    const [wH, wM] = wake.split(':').map(Number);
                    let sTotal = sH * 60 + sM;
                    let wTotal = wH * 60 + wM;
                    if (wTotal < sTotal) wTotal += 24 * 60; 
                    return wTotal - sTotal; 
                };

                const formatDuration = (minutes) => {
                    if (!minutes) return '0h';
                    const h = Math.floor(minutes / 60);
                    const m = minutes % 60;
                    return `${h}h${m > 0 ? ` ${m}m` : ''}`;
                };
                const currentTotalSleepMins = currentSleeps.reduce((acc, curr) => acc + curr.duration, 0);

                const findPreviousExerciseHistory = (exerciseName, currentDateKey) => {
                    if (!exerciseName.trim()) return null;
                    const [cd, cm, cy] = currentDateKey.split('/').map(Number);
                    const currentObjDate = new Date(cy, cm - 1, cd);

                    const pastDates = Object.keys(workoutsByDate).filter(key => {
                        const [d, m, y] = key.split('/').map(Number);
                        return new Date(y, m - 1, d) < currentObjDate;
                    }).sort((a, b) => {
                        const [da, ma, ya] = a.split('/').map(Number);
                        const [db, mb, yb] = b.split('/').map(Number);
                        return new Date(yb, mb - 1, db) - new Date(ya, ma - 1, da); 
                    });

                    const histories = [];
                    for (const date of pastDates) {
                        const workout = workoutsByDate[date];
                        if (workout && workout.exercises) {
                            const prevEx = workout.exercises.find(ex => ex.name.toLowerCase().trim() === exerciseName.toLowerCase().trim());
                            if (prevEx && (prevEx.rawText || (prevEx.sets && prevEx.sets.length > 0))) {
                                const [d, m, y] = date.split('/');
                                const dayName = VN_DAYS[new Date(y, m - 1, d).getDay()];
                                histories.push({ dateStr: `${dayName}-${date}`, sets: prevEx.sets, rawText: prevEx.rawText });
                                if (histories.length >= 2) break;
                            }
                        }
                    }
                    return histories.length > 0 ? histories : null;
                };

                {}
                const handleImageUpload = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            setImagePreview(reader.result);
                            setImageBase64(reader.result);
                        };
                        reader.readAsDataURL(file);
                    }
                };

                const handleScanFood = async () => {
                    // KIỂM TRA API KEY TRƯỚC KHI GỌI
                    if (!geminiApiKey || geminiApiKey.trim() === '') {
                        showToast('Vui lòng nhập Gemini API Key trong phần Cài đặt!', 'error');
                        return;
                    }

                    if (!imageBase64 && !foodDescription) {
                        showToast('Vui lòng chọn ảnh hoặc nhập mô tả món ăn!', 'error');
                        return;
                    }
                    
                    setIsScanning(true);
                    try {
                        let parts = [];
                        if (foodDescription) {
                            parts.push({ text: `Phân tích món ăn sau: "${foodDescription}"` });
                        } else {
                            parts.push({ text: `Phân tích món ăn trong ảnh` });
                        }

                        if (imageBase64) {
                            const base64Data = imageBase64.split(',')[1];
                            parts.push({
                                inlineData: { mimeType: 'image/jpeg', data: base64Data }
                            });
                        }

                        const payload = {
                            contents: [{ role: "user", parts: parts }],
                            systemInstruction: {
                                parts: [{ text: "Bắt buộc phân tích ngầm tỷ lệ nguyên liệu theo khối lượng. Tính toán chặt chẽ: calo = protein * 4 + carb * 4 + fat * 9. BẮT BUỘC trả về 1 object JSON thuần túy gồm: {\"name\": \"Tên món\", \"kcal\": 0, \"protein\": 0, \"carb\": 0, \"fat\": 0}." }]
                            },
                            generationConfig: {
                                responseMimeType: "application/json"
                            }
                        };

                        // Dùng geminiApiKey lấy từ cấu hình
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${geminiApiKey.trim()}`;
                        
                        const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        
                        if (!response.ok) {
                            const errData = await response.json();
                            throw new Error(errData.error?.message || `Lỗi kết nối API (${response.status})`);
                        }

                        const result = await response.json();
                        
                        if (result.candidates && result.candidates.length > 0) {
                            const jsonText = result.candidates[0].content.parts[0].text;
                            const data = JSON.parse(jsonText);
                            
                            setFormData({
                                name: data.name || foodDescription || 'Món ăn quét từ AI',
                                kcal: data.kcal || 0,
                                protein: data.protein || 0,
                                carbs: data.carb || data.carbs || 0,
                                fat: data.fat || 0
                            });
                            setEntryMode('detail');
                            showToast('✨ Quét thành công! Hãy kiểm tra lại số liệu.', 'success');
                        } else {
                            throw new Error("Không nhận được kết quả từ AI");
                        }
                    } catch (error) {
                        console.error(error);
                        showToast('❌ Lỗi AI: ' + error.message, 'error');
                    }
                    setIsScanning(false);
                };

                {}
                const handleSyncPush = async () => {
                    if(!gasUrl) { showToast('Vui lòng nhập link Script!', 'error'); return; }
                    setIsSyncing(true);
                    try {
                        const allDates = Array.from(new Set([...Object.keys(foodsByDate), ...Object.keys(sleepByDate)]));
                        const syncDataPayload = allDates.map(dKey => {
                            const fDay = foodsByDate[dKey] || [];
                            const sDay = sleepByDate[dKey] || [];

                            const formatMeal = (mealName) => {
                                const mFoods = fDay.filter(f => f.meal === mealName);
                                if (mFoods.length === 0) return 'X';
                                return mFoods.map(f => {
                                    const kcal = f.kcal !== undefined ? f.kcal : Math.round(f.carbs*4 + f.protein*4 + f.fat*9);
                                    return `${f.name}: ${kcal} kcal + ${f.protein} g protein`;
                                }).join('\n');
                            };

                            let sleepStr = '';
                            if (sDay.length > 0) {
                                const lastSleep = sDay[sDay.length - 1];
                                sleepStr = `${lastSleep.sleepTime}-${lastSleep.wakeTime}`;
                            }

                            return { date: dKey, sang: formatMeal('Sáng'), trua: formatMeal('Trưa'), chieu: formatMeal('Chiều'), ngoai_le: formatMeal('Ngoài lề'), ngu: sleepStr };
                        });

                        const finalPayload = syncDataPayload.filter(item => item.sang !== 'X' || item.trua !== 'X' || item.chieu !== 'X' || item.ngoai_le !== 'X' || item.ngu !== '');

                        let formattedWorkouts = [];
                        Object.keys(workoutsByDate).forEach(wDate => {
                            const wOut = workoutsByDate[wDate];
                            if (["Upper", "Lower", "Push", "Pull", "Leg"].includes(wOut.type)) {
                                const formattedExercises = wOut.exercises.map(ex => {
                                    const validSets = ex.sets.filter(s => s.weight.trim() !== '' || s.reps.trim() !== '');
                                    if (validSets.length === 0) return { name: ex.name, sets: [] };

                                    let allSame = true;
                                    const firstWeight = validSets[0].weight.trim();
                                    const firstUnit = validSets[0].unit.toUpperCase() === 'LBS' ? 'LBS' : 'kg';

                                    for (let i = 1; i < validSets.length; i++) {
                                        const w = validSets[i].weight.trim();
                                        const u = validSets[i].unit.toUpperCase() === 'LBS' ? 'LBS' : 'kg';
                                        if (w !== firstWeight || u !== firstUnit) {
                                            allSame = false;
                                            break;
                                        }
                                    }

                                    if (allSame) {
                                        const cleanSets = validSets.map(s => {
                                            let cUnit = s.unit.toUpperCase() === 'LBS' ? 'LBS' : 'kg';
                                            return { reps: s.reps, weight: s.weight, unit: cUnit };
                                        });
                                        return { name: ex.name, sets: cleanSets };
                                    } else {
                                        const mixedStrArray = validSets.map(s => {
                                            const w = s.weight.trim();
                                            const u = s.unit.toUpperCase() === 'LBS' ? 'LBS' : 'kg';
                                            const r = s.reps.trim() || '0';
                                            if (w === '') return r;
                                            return `${r}(${w}${u})`;
                                        });
                                        return { name: ex.name, sets: [{ reps: mixedStrArray.join('+'), weight: '', unit: '' }] };
                                    }
                                });
                                formattedWorkouts.push({ type: wOut.type, date: wDate, note: wOut.note, exercises: formattedExercises });
                            }
                        });
                        
                        formattedWorkouts.sort((a,b) => {
                           const [da, ma, ya] = a.date.split('/').map(Number);
                           const [db, mb, yb] = b.date.split('/').map(Number);
                           return new Date(ya, ma-1, da) - new Date(yb, mb-1, db);
                        });

                        const response = await fetch(gasUrl, { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                            body: JSON.stringify({ data: finalPayload, workoutsData: formattedWorkouts }) 
                        });

                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-2 flex items-center gap-1.5"><SparklesIcon size={14} className="text-emerald-500"/> Gemini API Key</label>
                                            <input type="text" value={geminiApiKey} onChange={(e) => setGeminiApiKey(e.target.value)} placeholder="Nhập API Key để dùng AI..." className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-emerald-500 text-sm font-medium text-slate-700" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button onClick={handleSyncPush} disabled={isSyncing} className="py-3 bg-blue-500 text-white rounded-xl font-bold flex flex-col items-center justify-center gap-1 hover:bg-blue-600 disabled:opacity-50"><UploadIcon size={20} /> <span className="text-xs">Đẩy lên Sheet</span></button>
                                            <button onClick={handleSyncPull} disabled={isSyncing} className="py-3 bg-emerald-500 text-white rounded-xl font-bold flex flex-col items-center justify-center gap-1 hover:bg-emerald-600 disabled:opacity-50"><DownloadIcon size={20} /> <span className="text-xs">Tải từ Sheet</span></button>
                                        </div>
                                        {isSyncing && <p className="text-center text-blue-500 text-sm font-bold flex items-center justify-center gap-2"><LoaderIcon className="animate-spin" size={16} /> Đang xử lý...</p>}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
            
        } catch (error) {
            console.error(error);
        }
    </script>
</body>
</html>
